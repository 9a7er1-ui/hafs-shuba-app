<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<title>مصحف حفص وشعبة</title>
<style>
:root{--paper:#fdfbf5;--edge:#7a9a88;--ink:#000;--muted:#6f8f7f;--sel:rgba(214,170,60,.35);--ui:#fdfaf4;--uitx:#222;--line:#e6e0d2;--acc:#3f6b3f;--acc2:#5f7a3a;
  --lib:#f2eeea;--card:#fcfaf6;--tlab:#9a8a73;--qv:#8b1f1f;--ref:#a09484;
  --c-h:#b30000;--c-i:#9a009a;--c-m:#d96f00;--c-w:#005c00;--c-n:#0000b3;
  --hl-y:rgba(255,214,0,.38);--hl-g:rgba(76,175,80,.30);--hl-b:rgba(66,133,244,.28);--hl-p:rgba(233,30,99,.25);--hl-o:rgba(255,152,0,.32);
  --sys:-apple-system,"SF Arabic","SF Pro Text",system-ui,"Segoe UI",Tahoma,sans-serif}
body.night{--paper:#1c1c1a;--edge:#2b3a32;--ink:#e9e4d6;--muted:#9fb8a9;--ui:#262624;--uitx:#eee;--line:#3a3833;--lib:#1f1e1c;--card:#2a2926;--tlab:#b9a98f;--qv:#e08a7a;--ref:#9a8f80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--edge);overflow:hidden;font-family:var(--sys);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;color:inherit}
svg.i{width:1.35em;height:1.35em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* ---------- page ---------- */
#page{position:absolute;inset:0;margin:auto;background:var(--paper);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#page.odd{border-radius:0 16px 16px 0;box-shadow:3px 0 0 #f4f0e7,4px 0 0 #d8d1c3,7px 0 0 #f4f0e7,8px 0 0 #d8d1c3,11px 0 0 #f4f0e7,12px 0 0 #cfc7b8}
#page.even{border-radius:16px 0 0 16px;box-shadow:-3px 0 0 #f4f0e7,-4px 0 0 #d8d1c3,-7px 0 0 #f4f0e7,-8px 0 0 #d8d1c3,-11px 0 0 #f4f0e7,-12px 0 0 #cfc7b8}
body.night #page.odd,body.night #page.even{box-shadow:none}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:clamp(14px,2.2vh,21px);padding:.5em 1.6em .1em}
.foot{justify-content:center;padding:.1em 0 .6em}
#lines{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.line{position:relative;display:flex;align-items:center;white-space:nowrap;direction:rtl;color:var(--ink);-webkit-text-stroke:.018em currentColor}
.line.just{justify-content:space-between}
.line.center{justify-content:center}
.line.center .w{margin:0 .07em}
.w{cursor:pointer;border-radius:.15em;line-height:1}
.w.sel{background:var(--sel)!important}
.w.d-h{color:var(--c-h)}.w.d-i{color:var(--c-i)}.w.d-m{color:var(--c-m)}.w.d-w{color:var(--c-w)}.w.d-n{color:var(--c-n)}
body.nodiff .w[class*="d-"]{color:inherit}body.nodiff .dot{display:none}
.w.hl-y{background:var(--hl-y)}.w.hl-g{background:var(--hl-g)}.w.hl-b{background:var(--hl-b)}.w.hl-p{background:var(--hl-p)}.w.hl-o{background:var(--hl-o)}
.num{color:var(--ink)!important}
.dot{position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;-webkit-text-stroke:0;pointer-events:none}
.hdr{position:relative;display:flex;align-items:center;justify-content:center}
.hdr img{width:100%;height:100%;display:block;filter:brightness(.86) saturate(1.25) contrast(1.06)}
.hdr svg{position:absolute;height:62%;top:19%;overflow:visible}
.hdr svg path{fill:#141414;stroke:#dcebd2;stroke-width:2;stroke-linejoin:round}
.bsm{display:flex;justify-content:center;align-items:center;font-family:bsml;color:var(--ink);-webkit-text-stroke:.012em var(--paper);paint-order:fill stroke;direction:ltr;unicode-bidi:bidi-override}
/* ---------- bars ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:4;background:var(--ui);color:var(--acc);display:flex;align-items:center;gap:.4em;
  padding:calc(env(safe-area-inset-top,0) + .55em) 1em .55em;border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .2s}
#top.open,#bot.open{transform:none}
#top button{background:none;border:0;padding:.25em .45em;font-size:20px;color:var(--acc)}
#top .sp{flex:1;text-align:center;color:var(--muted);font-size:15px}
.cal{position:relative;display:inline-flex;align-items:center;justify-content:center}
.cal b{position:absolute;font-size:10px;top:52%;transform:translateY(-35%);font-weight:700}
#bot{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--ui);border-top:1px solid var(--line);padding:.8em 1.2em calc(.8em + env(safe-area-inset-bottom,0));
  transform:translateY(110%);transition:transform .2s;display:flex;align-items:center;gap:.8em}
#slider{flex:1;direction:rtl;-webkit-appearance:none;appearance:none;height:26px;background:transparent}
#slider::-webkit-slider-runnable-track{height:24px;border-radius:12px;background:var(--line)}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:24px;border-radius:12px;background:var(--acc);margin-top:0}
#bubble{position:fixed;bottom:calc(4.4em + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:10px;padding:.25em .9em;font-size:15px;display:none;z-index:5}
#here{background:var(--acc);color:#fff;border:0;border-radius:20px;padding:.35em 1em;font-size:15px;display:none;white-space:nowrap}
#here.on{display:block}
/* ---------- generic overlays ---------- */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:6;display:none}
.dim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--ui);color:var(--uitx);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
  padding:1em 1.2em calc(1em + env(safe-area-inset-bottom,0));transform:translateY(110%);transition:transform .22s;z-index:7;max-height:80vh;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet>*{flex:none}.sheet>.bd{flex:1 1 auto;min-height:0}
.hd{display:flex;align-items:center;gap:.5em;margin-bottom:.5em;font-weight:700;font-size:18px}
.hd .sp{flex:1}
.x{border:0;background:none;font-size:24px;color:#999;padding:0 .2em}
.bd{overflow:auto;font-size:var(--tsize,19px);line-height:1.95;-webkit-user-select:text;user-select:text}
.just-t{text-align:justify;text-justify:inter-word}
.k{color:var(--acc);font-weight:700}
.mini{border:1px solid var(--line);background:none;color:var(--acc);border-radius:20px;padding:.15em .9em;font-size:15px}
.pill{appearance:none;-webkit-appearance:none;border:0;background:#ebe7df;color:var(--acc2);border-radius:28px;padding:.45em 2.2em .45em 1.3em;font:inherit;font-size:18px;
  background-image:linear-gradient(45deg,transparent 50%,var(--acc2) 50%),linear-gradient(135deg,var(--acc2) 50%,transparent 50%);background-position:1.0em 55%,1.4em 55%;background-size:.4em .4em;background-repeat:no-repeat}
body.night .pill{background-color:#3a3833}
.tabs{display:flex;gap:.35em;overflow-x:auto;padding-bottom:.4em;margin-bottom:.4em;border-bottom:1px solid var(--line)}
.tabs button{flex:none;border:1px solid var(--line);background:none;border-radius:20px;padding:.2em .9em;font-size:15px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.acts{display:flex;justify-content:space-around;background:#d8d8c4;color:#3a3a2a;padding:.55em .3em;margin:0 -1.2em -1em;border-radius:0 0 18px 18px}
body.night .acts{background:#3a3a30;color:#ddd}
.sheet .acts{margin:.6em -1.2em calc(-1em - env(safe-area-inset-bottom,0));padding-bottom:calc(.55em + env(safe-area-inset-bottom,0));border-radius:0}
.acts button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.15em;font-size:14px;padding:.1em .5em}
.acts button.on{color:var(--acc)}
.shu{margin-top:.2em;padding:.35em .8em;border-radius:10px;background:rgba(77,122,94,.08)}
.qt{font-family:"Amiri Quran",Amiri,serif;font-size:1.15em}
.qv{color:var(--qv);font-family:"Amiri Quran",Amiri,serif}
.ref{color:var(--ref)}
/* center pop */
#pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:all .18s;z-index:7;
  width:min(92vw,600px);max-height:78vh;background:var(--ui);color:var(--uitx);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);
  display:flex;flex-direction:column;padding:1em 1.2em 1em;overflow:hidden}
#pop.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#pop .top{display:flex;justify-content:center;margin-bottom:.6em}
#pop .bd{flex:1 1 auto;min-height:0}
/* full panel (word) */
#full{position:fixed;inset:0;z-index:7;background:var(--ui);color:var(--uitx);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0) + .8em) 1.2em 0}
#full.open{display:flex}
#full .ay{font-family:"Amiri Quran",Amiri,serif;font-size:24px;line-height:2;text-align:center;color:#8a8a8a;margin:.4em 0}
#full .ay .hw{color:var(--qv)}
#full .big{font-family:"Amiri Quran",Amiri,serif;font-size:64px;text-align:center;color:var(--acc2);margin:.2em 0 .4em}
#full .bd{flex:1;text-align:center}
#full .ctl{display:flex;justify-content:space-around;color:var(--acc2);padding:.6em 0;font-size:20px}
#full .ctl button{background:none;border:0;color:var(--acc2)}
#full .acts{margin:0 -1.2em;border-radius:0;background:var(--acc2);color:#fff;padding-bottom:calc(.6em + env(safe-area-inset-bottom,0))}
/* library */
#lib{position:fixed;inset:0;z-index:8;background:var(--lib);color:var(--uitx);display:none;flex-direction:column;font-family:var(--sys)}
#lib.open{display:flex}
#lib .lh{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0) + .9em) 1.1em .7em;border-bottom:1px solid var(--line)}
#lib .lh .ttl{flex:1;text-align:center;font-weight:700;font-size:21px}
#lib .lh .ref2{color:var(--acc);font-size:19px;min-width:6em;text-align:right;display:flex;align-items:center;gap:.2em;justify-content:flex-start}
#lib .xw{min-width:6em;display:flex;justify-content:flex-end}
#lib .xc{width:42px;height:42px;border-radius:50%;background:#e2dbd1;border:0;color:#6b5a48;font-size:20px;display:flex;align-items:center;justify-content:center}
#lib .lb{flex:1;overflow:auto;padding:1.2em 1.1em 2em;-webkit-overflow-scrolling:touch}
#lib .ayah{text-align:center;direction:rtl;color:var(--ink);font-size:30px;line-height:2.1;margin:.4em .2em 1.4em;-webkit-text-stroke:.012em currentColor}
#lib .ayah span{margin:0 .05em}
.tc{margin-bottom:1.6em}
.tc .tl{display:flex;justify-content:space-between;align-items:center;color:var(--tlab);font-size:18px;padding:0 .6em .45em}
.tc .dots{background:none;border:0;color:var(--acc);font-size:22px;letter-spacing:2px;line-height:1;padding:0 .2em}
.tc .card{background:var(--card);border-radius:18px;padding:1em 1.1em;font-size:var(--tsize,19px);line-height:1.95;text-align:justify;-webkit-user-select:text;user-select:text}
.tc .card .qh{color:var(--qv);font-family:"Amiri Quran",Amiri,serif;border-bottom:1px solid var(--line);padding-bottom:.5em;margin-bottom:.6em}
#lib .lf{display:flex;align-items:center;gap:.6em;padding:.7em 1.1em calc(.7em + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--lib)}
#lib .lf .nb{width:3.2em;height:2.6em;border-radius:14px;background:#e6e0d6;border:0;color:var(--acc);font-size:20px}
#lib .lf .cp{flex:1;height:2.6em;border-radius:14px;background:#e6e0d6;border:0;color:var(--acc);font-size:19px}
#lib .lf .fs{background:none;border:0;color:var(--acc);font-size:22px;font-weight:700;width:2.4em}
body.night #lib .lf .nb,body.night #lib .lf .cp,body.night #lib .xc{background:#33312d}
.menu{position:fixed;z-index:9;background:rgba(245,244,242,.98);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:240px;overflow:hidden;display:none;color:#222}
.menu.open{display:block}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:.8em 1.1em;font-size:17px;border-bottom:1px solid #ddd;text-align:right}
.menu button:last-child{border-bottom:0}
.menu .sepr{height:8px;background:#e4e2de}
/* drawer */
#drw{position:fixed;top:0;bottom:0;right:0;width:min(100vw,520px);background:#f3efe9;color:#222;z-index:7;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
body.night #drw{background:#232220;color:#eee}
#drw.open{transform:none}
#drw .dh{display:flex;align-items:center;gap:.6em;padding:calc(env(safe-area-inset-top,0) + .7em) 1em .7em;border-bottom:1px solid var(--line)}
.seg{flex:1;display:flex;background:#e7e2da;border-radius:12px;padding:3px;max-width:420px;margin:auto}
body.night .seg{background:#33312d}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:.4em .2em;font-size:15px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
body.night .seg button.on{background:#4a4740}
.back{width:40px;height:40px;border-radius:50%;border:0;background:#e7e2da;color:var(--acc);font-size:20px;flex:none}
#drw .db{flex:1;display:flex;min-height:0}
#dlist{flex:1;overflow:auto;padding:0 1em 1em;-webkit-overflow-scrolling:touch}
#jstrip{width:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--acc);font-size:12px;gap:2px;padding:.5em 0}
#jstrip span{cursor:pointer;padding:1px 4px}
.gh{color:#8d7c66;font-size:17px;padding:1.1em .2em .3em}
.row{display:flex;align-items:center;gap:.9em;padding:.65em .1em;border-bottom:1px solid var(--line);cursor:pointer}
.row .n{width:2.5em;height:2.5em;border-radius:50%;background:#e7e2da;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
body.night .row .n{background:#33312d}
.row .n.cur{background:#2f7d3a;color:#fff}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:20px;font-weight:700}
.row .t small{display:block;color:#8d7c66;font-size:14px;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .del{border:0;background:none;color:#a33;font-size:20px}
#drw .dn{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:.5em 0 calc(.5em + env(safe-area-inset-bottom,0))}
#drw .dn button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:13px;color:#8a8a8a}
#drw .dn button.on{color:var(--acc)}
.kh{border:1px solid var(--line);border-radius:12px;padding:.7em .9em;margin:.7em 0;background:rgba(255,255,255,.5)}
body.night .kh{background:rgba(255,255,255,.04)}
.kh.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.kh h3{margin:0 0 .3em;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.kh .meta{color:#8d7c66;font-size:15px;line-height:1.7}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:.4em 0}
.prog i{display:block;height:100%;background:var(--acc)}
input,select,textarea{font:inherit;padding:.45em .6em;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--uitx);width:100%}
textarea{min-height:8em;-webkit-user-select:text;user-select:text}
.set{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.6em 0;border-bottom:1px solid var(--line);font-size:17px}
.set label{flex:1}.set select{width:auto;min-width:9em}
.legend span{display:inline-block;margin:.15em .4em;font-size:15px}
.legend i{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:middle;margin-left:.3em}
.swatches{display:flex;gap:.8em;justify-content:center;padding:.6em 0}
.swatches button{width:2.4em;height:2.4em;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}
/* tafsir khatma view */
#tview{position:fixed;inset:0;background:var(--paper);color:var(--ink);z-index:3;display:none;flex-direction:column}
#tview.open{display:flex}
#tview .tp{display:flex;align-items:center;gap:.5em;padding:calc(env(safe-area-inset-top,0) + .5em) 1em .4em;border-bottom:1px solid var(--line);color:var(--muted);font-size:16px;flex:none}
#tview .tp .sp{flex:1;text-align:center}
#tview .tabs{padding:.4em 1em;margin:0;flex:none}
#tvBody{overflow:auto;padding:.6em 1.2em 6em;flex:1;-webkit-overflow-scrolling:touch}
.tv-a{font-family:"Amiri Quran",Amiri,serif;font-size:calc(var(--tsize,19px)*1.35);line-height:2.1;margin:.8em 0 .2em;color:var(--ink)}
.tv-a .an{color:var(--acc);font-size:.8em}
.tv-t{font-size:var(--tsize,19px);line-height:1.95;color:var(--uitx);padding:.2em .8em .8em;border-right:3px solid var(--line);text-align:justify}
.tv-h{text-align:center;color:var(--acc);font-family:"Amiri Quran",Amiri,serif;font-size:1.4em;margin:.6em 0}
#tvBtns{position:fixed;left:1em;bottom:calc(1em + env(safe-area-inset-bottom,0));display:flex;gap:.5em;z-index:3}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:.55em 1.3em;border-radius:10px;z-index:20;display:none;font-size:16px}
.res{padding:.6em .2em;border-bottom:1px solid var(--line);cursor:pointer}
.res .qt{display:block;color:var(--ink)}.res small{color:var(--muted)}
</style>
</head>
<body>
<div id="msg">جارٍ التحميل…</div>
<div id="page" hidden>
  <div class="bar"><span id="juz"></span><span id="sname"></span></div>
  <div id="lines"></div>
  <div class="bar foot" id="pno"></div>
</div>

<div id="top">
  <button onclick="openDrawer('index')" aria-label="الفهرس"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h12M4 12h16M4 18h12"/><circle cx="20" cy="6" r=".6"/><circle cx="20" cy="18" r=".6"/></svg></button>
  <button onclick="openSearch()" aria-label="البحث"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  <span class="sp" id="topInfo"></span>
  <button onclick="showHijri()" aria-label="التقويم"><span class="cal"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg><b id="hday"></b></span></button>
  <button onclick="openSettings()" aria-label="الإعدادات"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="7"/></svg></button>
</div>
<div id="bot">
  <button id="here" onclick="markHere()">وصلتُ هنا</button>
  <input type="range" id="slider" min="1" max="604" value="1">
</div>
<div id="bubble"></div>

<div id="tview"><div class="tp"><button class="mini" onclick="show(cur+1)">‹ التالية</button><span class="sp" id="tvTitle"></span><button class="mini" onclick="show(cur-1)">السابقة ›</button></div>
  <div class="tabs" id="tvTabs"></div><div id="tvBody"></div></div>
<div id="tvBtns" style="display:none">
  <button class="mini" style="background:var(--ui)" onclick="tvMushaf=true;updateTview()">المصحف</button>
  <button class="mini" style="background:var(--acc);color:#fff;border-color:var(--acc)" onclick="markHere()">وصلتُ هنا</button>
  <button class="mini" style="background:var(--ui)" onclick="openDrawer('index')">الفهرس</button></div>

<script>
const FONT_BASE='https://raw.githubusercontent.com/zonetecde/mushaf-layout/refs/heads/v2/fonts/QPC2/';
const TAF_BASE=['https://raw.githubusercontent.com/spa5k/tafsir_api/main/tafsir/','https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir/'];
const TAFSIRS=[['ar-tafsir-al-mukhtasar','المختصر'],['ar-tafsir-muyassar','التفسير الميسر'],['ar-tafseer-al-saddi','تفسير السعدي'],
  ['ar-tafsir-ibn-kathir','تفسير ابن كثير'],['ar-tafsir-al-baghawi','تفسير البغوي'],['ar-tafsir-al-tabari','تفسير الطبري']];
const DIFF_NAMES={h:'حرف يخالف حفصًا',i:'إدغام كامل',m:'إمالة وصلًا ووقفًا',w:'إمالة وقفًا فقط',n:'إدغام ناقص بغنة'};
const KH=[['hifz','ختمة الحفظ'],['tilawa','ختمة التلاوة'],['tafsir','ختمة التفسير']];
const HLC=[['y','أصفر'],['g','أخضر'],['b','أزرق'],['p','وردي'],['o','برتقالي']];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let Q,M,LAYOUT,NAMES={},DIFFS={},QUARTERS=[],AYTOK={},cur=1,surahFirst={},loaded={},selEl=null;

/* ---------- storage ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=Object.assign({tafsir:0,tsize:19,night:false,diffs:true,mode:'bottom'},load('settings',{}));
let K=load('khatmas',{active:'hifz',hifz:{page:1,wird:1},tilawa:{page:1,wird:20},tafsir:{page:1,wird:2}});
let BM=load('bookmarks',[]),HL=load('highlights',{}),NT=load('notes',{});
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1700)}

/* ---------- fonts ---------- */
function loadFont(fam,url){
  if(loaded[fam])return loaded[fam];
  const f=new FontFace(fam,`url(${url})`);
  loaded[fam]=f.load().then(x=>{document.fonts.add(x);return x}).catch(e=>{delete loaded[fam];throw e});
  return loaded[fam];
}
const pageFont=p=>loadFont('p'+p,FONT_BASE+'p'+String(p).padStart(3,'0')+'.woff2');

/* ---------- helpers ---------- */
const sname=s=>Q.surahs[s-1][0];
const ayRef=k=>{const[s,a]=k.split(':');return `${sname(s)}: ${AR(a)}`};
function juzOf(p){let j=1;Q.juzPages.forEach((s,i)=>{if(p>=s)j=i+1});return j}
function firstKey(p){for(const l of LAYOUT[p-1])if(l.w)for(const w of l.w)if(w[0])return w[0];return '1:1:0'}
const surahOfPage=p=>+firstKey(p).split(':')[0];
const ayahOf=k=>k.split('|')[0].split(':').slice(0,2).join(':');
function nextAyah(k,d){let[s,a]=k.split(':').map(Number);a+=d;
  if(a<1){if(s===1)return null;s--;a=Q.surahs[s-1][2]}else if(a>Q.surahs[s-1][2]){if(s===114)return null;s++;a=1}return s+':'+a}
function fmtTafsir(t){
  let h=esc(t||'');
  h=h.replace(/﴿[^﴾]*﴾|\{[^}\n]{2,400}\}/g,m=>`<span class="qv">${m}</span>`).replace(/\[[^\]\n]{1,40}\]/g,m=>`<span class="ref">${m}</span>`);
  return h.replace(/\n+/g,'<br>');
}

/* ---------- init ---------- */
async function init(){
  try{
    [Q,M,LAYOUT,NAMES]=await Promise.all(['quran.json','meanings.json','layout.json','surah-names.json']
      .map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()})));
  }catch(e){$('msg').textContent='تعذّر تحميل: '+e.message;return}
  try{const r=await fetch('diffs.json');if(r.ok)DIFFS=await r.json()}catch(e){}
  try{const r=await fetch('quarters.json');if(r.ok)QUARTERS=await r.json()}catch(e){}
  try{await loadFont('bsml',FONT_BASE.replace('QPC2/','QPC1/')+'QPC1BSML.ttf')}catch(e){}
  LAYOUT.forEach((pg,i)=>{let last=null;pg.forEach(l=>{
    if(l.h&&!surahFirst[l.h])surahFirst[l.h]=i+1;
    if(l.w)l.w.forEach(([k,g])=>{const parts=g.split(' ');
      if(k){last=ayahOf(k);(AYTOK[last]=AYTOK[last]||[]).push([parts[0],i+1,k]);parts.slice(1).forEach(m=>AYTOK[last].push([m,i+1,'']))}
      else if(last)parts.forEach(m=>AYTOK[last].push([m,i+1,'']))})})});
  applySettings();
  try{$('hday').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric'}).format(new Date())}catch(e){}
  $('msg').remove();$('page').hidden=false;
  K.active='hifz';save('khatmas',K);
  await document.fonts.ready;
  show(K.hifz.page||1);
}

/* ---------- page ---------- */
async function show(p){
  p=Math.max(1,Math.min(604,p|0||1));cur=p;closeAll(true);
  if(K.active==='hifz'){K.hifz.page=p;save('khatmas',K)}
  try{await pageFont(p)}catch(e){$('lines').textContent='تعذّر تحميل خط الصفحة — تأكد من الاتصال بالإنترنت';return}
  if(p!==cur)return;
  renderPage(p);
  [p+1,p-1,p+2].forEach(n=>{if(n>=1&&n<=604)pageFont(n).catch(()=>{})});
}
function renderPage(p){
  const box=$('lines');box.innerHTML='';
  const fam='p'+p;let lastAyah=ayahOf(firstKey(p));
  $('page').classList.toggle('odd',p%2===1);$('page').classList.toggle('even',p%2===0);
  LAYOUT[p-1].forEach(l=>{
    const div=document.createElement('div');
    if(l.h){const[d,x,y,w,h]=NAMES[l.h];div.className='hdr';div.innerHTML=`<img src="banner.png" alt=""><svg viewBox="${x} ${y} ${w} ${h}" style="aspect-ratio:${w}/${h}"><path d="${d}"/></svg>`}
    else if(l.b){div.className='bsm';div.textContent='#"!'}
    else{
      div.className='line';div.style.fontFamily=fam;let dotc=null;
      l.w.forEach(([k,g])=>{
        const parts=g.split(' ');
        if(k){
          const s=document.createElement('span');s.className='w';s.textContent=parts[0];s.dataset.k=k;
          lastAyah=ayahOf(k);s.dataset.a=lastAyah;
          const d=k.split('|').map(x=>DIFFS[x]).find(Boolean);
          if(d){s.classList.add('d-'+d.c);if(!dotc)dotc=d.c}
          if(HL[lastAyah])s.classList.add('hl-'+HL[lastAyah]);
          bindWord(s);div.appendChild(s);
        }else parts.unshift('');
        parts.slice(1).forEach(m=>{const n=document.createElement('span');n.className='w num';n.textContent=m;n.dataset.a=lastAyah;bindMarker(n);div.appendChild(n)});
      });
      if(dotc){const dt=document.createElement('span');dt.className='dot';dt.style.background=`var(--c-${dotc})`;div.appendChild(dt)}
    }
    box.appendChild(div);
  });
  $('sname').textContent=sname(surahOfPage(p));
  $('juz').textContent='الجزء '+AR(juzOf(p));
  $('pno').textContent=AR(p);
  $('slider').value=p;$('topInfo').textContent=`${sname(surahOfPage(p))} · صفحة ${AR(p)}`;
  layout();updateBadges();updateTview();
}
function layout(){
  const pg=$('page'),box=$('lines');if(!box.children.length)return;
  const vw=innerWidth,vh=innerHeight;
  const W=Math.min(vw-14,vh*0.68);pg.style.width=W+'px';
  const lines=[...box.children];
  const FULL=16.4,lh=1.78;
  const barH=$('juz').parentElement.offsetHeight+$('pno').offsetHeight;
  const fsH=(vh-barH-10)/(15*lh);
  const fs=Math.min(W*0.86/FULL,fsH);
  box.style.fontSize=fs+'px';
  const lineW=FULL*fs,centeredPage=cur<=2,margin=(W-lineW)/2;
  lines.forEach(l=>{
    l.style.height=(fs*lh)+'px';
    if(l.classList.contains('hdr')){const bh=lineW*135/1200;l.style.width=lineW+'px';l.style.height=bh+'px';l.style.margin=Math.max(0,(fs*lh-bh)/2)+'px 0'}
    else if(l.classList.contains('bsm')){l.style.fontSize=fs*1.05+'px'}
    else{
      l.classList.remove('just','center');l.style.fontSize='';l.style.width='auto';
      const nat=l.scrollWidth;
      l.classList.add(centeredPage||nat<lineW*0.82?'center':'just');
      l.style.width=lineW+'px';
      if(l.scrollWidth>lineW+0.5)l.style.fontSize=(fs*lineW/l.scrollWidth*0.995)+'px';   // never overflow the text frame
      const dt=l.querySelector('.dot');
      if(dt){const off=-(margin/2)-3.5;dt.style.right=dt.style.left='';if(cur%2===1)dt.style.right=off+'px';else dt.style.left=off+'px'}
    }
  });
}

/* ---------- press handling ---------- */
function bindPress(el,onTap,onLong){
  let t=null,long=false,sx=0,sy=0;
  const start=e=>{long=false;const pt=e.touches?e.touches[0]:e;sx=pt.clientX;sy=pt.clientY;t=setTimeout(()=>{long=true;onLong();if(navigator.vibrate)navigator.vibrate(15)},450)};
  const move=e=>{const pt=e.touches?e.touches[0]:e;if(Math.abs(pt.clientX-sx)>10||Math.abs(pt.clientY-sy)>10)clearTimeout(t)};
  const end=()=>clearTimeout(t);
  el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchmove',move,{passive:true});el.addEventListener('touchend',end);
  el.addEventListener('mousedown',start);el.addEventListener('mouseup',end);el.addEventListener('mouseleave',end);
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('click',ev=>{ev.stopPropagation();if(long){long=false;return}onTap()});
}
const bindWord=s=>bindPress(s,()=>openMeaning(s),()=>openDiff(s));
const bindMarker=n=>bindPress(n,()=>openAyahTafsir(n.dataset.a),()=>openLib(n.dataset.a));
function selectWord(s){if(selEl)selEl.classList.remove('sel');selEl=s;if(s)s.classList.add('sel')}

/* ---------- panel (bottom / center / full) ---------- */
const panel={ayah:null,word:null,kind:null,shareText:''};
const ICONS={"menu": "<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 6h12M4 12h16M4 18h12\"/><circle cx=\"20\" cy=\"6\" r=\".6\"/><circle cx=\"20\" cy=\"18\" r=\".6\"/></svg>", "search": "<svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"M16 16l4.5 4.5\"/></svg>", "cal": "<svg class=\"i\" viewBox=\"0 0 24 24\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M3.5 9.5h17M8 3v4M16 3v4\"/></svg>", "gear": "<svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3.2\"/><path d=\"M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7\"/><circle cx=\"12\" cy=\"12\" r=\"7\"/></svg>", "share": "<svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"18\" cy=\"5.5\" r=\"2.3\"/><circle cx=\"6\" cy=\"12\" r=\"2.3\"/><circle cx=\"18\" cy=\"18.5\" r=\"2.3\"/><path d=\"M8 11l8-4.3M8 13l8 4.3\"/></svg>", "alert": "<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 5h16v11H9l-5 4z\"/><path d=\"M12 8v4M12 14.2v.3\"/></svg>", "expand": "<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7\"/></svg>", "list": "<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M9 6h11M9 12h11M9 18h11\"/><circle cx=\"4.5\" cy=\"6\" r=\"1\"/><circle cx=\"4.5\" cy=\"12\" r=\"1\"/><circle cx=\"4.5\" cy=\"18\" r=\"1\"/></svg>", "check": "<svg class=\"i\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8.5\"/><path d=\"M8 12.3l2.8 2.8L16.3 9.5\"/></svg>", "bookmark": "<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M6.5 3.5h11v17l-5.5-4-5.5 4z\"/></svg>", "marker": "<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M14.5 4.5l5 5L10 19H5v-5z\"/><path d=\"M3 21h18\"/></svg>", "comment": "<svg class=\"i\" viewBox=\"0 0 24 24\"><path d=\"M4 4.5h16v12H10l-4.5 3.5v-3.5H4z\"/></svg>"};
function icon(n){return ICONS[n]||''}
function actsHTML(){
  const a=panel.ayah;const bm=BM.some(b=>b.k===a),hl=!!HL[a],nt=!!NT[a];
  return `<button class="${nt?'on':''}" onclick="editNote()">${icon('comment')}تعليق</button>
    <button class="${hl?'on':''}" onclick="pickColor()">${icon('marker')}تلوين</button>
    <button class="${bm?'on':''}" onclick="toggleBM()">${icon('bookmark')}فاصل</button>
    <button onclick="shareCurrent()">${icon('share')}شارك</button>`;
}
function openPanel({title,selHTML,body,ayah,word}){
  panel.ayah=ayah;panel.word=word||null;
  const mode=S.mode;closeAll(true);
  if(word)selectWord(word);
  if(mode==='center'){
    $('popSel').innerHTML=selHTML||`<span class="pill" style="background-image:none;padding:.45em 1.3em">${esc(title)}</span>`;
    $('popBody').innerHTML='';$('popBody').append(body);$('popActs').innerHTML=actsHTML();
    $('dim').classList.add('open');$('pop').classList.add('open');
  }else if(mode==='full'&&word){
    const keys=word.dataset.k.split('|');const[s,a,i]=keys[0].split(':');
    const ws=Q.text[s+':'+a].split(' ');const idx=keys.map(k=>+k.split(':')[2]);
    $('fullAy').innerHTML='﴿ '+ws.map((w,j)=>idx.includes(j)?`<span class="hw">${esc(w)}</span>`:esc(w)).join(' ')+' ﴾';
    $('fullBig').textContent=idx.map(j=>ws[j]).join(' ');
    $('fullBody').innerHTML='';$('fullBody').append(body);$('fullActs').innerHTML=actsHTML();
    $('full').classList.add('open');
  }else{
    $('shTitle').textContent=title;$('shSel').innerHTML=selHTML||'';
    $('shBody').innerHTML='';$('shBody').append(body);$('shActs').innerHTML=actsHTML();
    $('sheet').classList.add('open');
  }
}
function refreshActs(){['popActs','shActs','fullActs'].forEach(id=>{if($(id))$(id).innerHTML=actsHTML()})}

function meaningNode(keys){
  const f=document.createElement('div');panel.shareText='';
  keys.forEach(k=>{
    const m=M[k],p=document.createElement('div');
    if(m){const w=m.w.replace(/^\d+\s+/,'');
      if(S.mode!=='full'){const b=document.createElement('span');b.className='k';b.textContent=w+': ';p.appendChild(b)}
      p.appendChild(document.createTextNode(m.t));panel.shareText+=`${w}: ${m.t}\n`}
    else p.textContent='لا يوجد معنى لهذه الكلمة';
    f.appendChild(p);
  });
  return f;
}
function openMeaning(s){
  const keys=s.dataset.k.split('|');panel.kind='meaning';
  const sel=S.mode==='center'?`<span class="pill" style="background-image:none;padding:.45em 1.4em">المعنى</span>`:'';
  openPanel({title:'معنى الكلمة — '+ayRef(ayahOf(keys[0])),selHTML:sel,body:meaningNode(keys),ayah:ayahOf(keys[0]),word:s});
}
function diffNode(keys){
  const f=document.createElement('div');const d=keys.map(k=>DIFFS[k]).find(Boolean);
  if(!d){f.textContent='لا خلاف بين حفص وشعبة في هذه الكلمة.';panel.shareText='';return f}
  f.style.textAlign='right';
  f.innerHTML=`<div class="shu" style="border-right:4px solid var(--c-${d.c})"><b style="color:var(--c-${d.c})">${DIFF_NAMES[d.c]}</b></div>
    <div style="margin:.4em 0"><span class="k">حفص:</span> <span class="qt">${esc(d.h)}</span>&nbsp;&nbsp; <span class="k">شعبة:</span> <span class="qt">${esc(d.s)}</span></div>`+
    d.d.map(t=>`<div>• ${esc(t)}</div>`).join('');
  panel.shareText=`خلاف شعبة (${DIFF_NAMES[d.c]}): حفص «${d.h}» — شعبة «${d.s}»\n`+d.d.join('\n');
  return f;
}
function openDiff(s){
  const keys=s.dataset.k.split('|');panel.kind='diff';
  const sel=S.mode==='center'?`<span class="pill" style="background-image:none;padding:.45em 1.4em">خلاف شعبة</span>`:'';
  openPanel({title:'خلاف شعبة — '+ayRef(ayahOf(keys[0])),selHTML:sel,body:diffNode(keys),ayah:ayahOf(keys[0]),word:s});
}
function fullStep(d){
  if(!panel.word)return;const all=[...document.querySelectorAll('#lines .w[data-k]')];const i=all.indexOf(panel.word)+d;
  if(i>=0&&i<all.length)(panel.kind==='diff'?openDiff:openMeaning)(all[i]);
}

/* ---------- tafsir ---------- */
const tafCache={};
async function fetchTafsir(slug,su,ay){
  const ck=slug+su+':'+ay;if(tafCache[ck]!=null)return tafCache[ck];
  for(const b of TAF_BASE){try{const r=await fetch(`${b}${slug}/${su}/${ay}.json`);if(r.ok){const j=await r.json();return tafCache[ck]=(j.text||'')}}catch(e){}}
  throw new Error('fail');
}

async function shareText(txt){

function wrapLines(ctx,words,maxW,sep){const out=[];let line='';
  words.forEach(w=>{const t=line?line+sep+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});if(line)out.push(line);return out}
async function shareImage(a,name,txt){
  const W=1200,P=70,cw=W-2*P;
  const toks=AYTOK[a]||[];const pages=[...new Set(toks.map(t=>t[1]))];
  await Promise.all(pages.map(p=>pageFont(p).catch(()=>{})));
  const banner=await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src='banner.png'});
  const c=document.createElement('canvas');const ctx=c.getContext('2d');
  const sysF='"SF Arabic",-apple-system,system-ui,Tahoma,sans-serif';
  // measure
  const qfs=56;ctx.font=`${qfs}px p${pages[0]}`;
  const qLines=[];let line=[],lw=0;
  toks.forEach(t=>{ctx.font=`${qfs}px p${t[1]}`;const w=ctx.measureText(t[0]).width+10;if(lw+w>cw&&line.length){qLines.push(line);line=[];lw=0}line.push([t,w]);lw+=w});if(line.length)qLines.push(line);
  ctx.font=`36px ${sysF}`;const tl=wrapLines(ctx,txt.replace(/\s+/g,' ').split(' '),cw-80,' ');
  const bh=banner?cw*banner.height/banner.width:0;
  const H=P+bh+40+qLines.length*qfs*1.9+60+50+tl.length*64+80+P;
  c.width=W;c.height=H;ctx.fillStyle='#fdfbf5';ctx.fillRect(0,0,W,H);
  let y=P;
  if(banner){ctx.filter='brightness(.86) saturate(1.25)';ctx.drawImage(banner,P,y,cw,bh);ctx.filter='none';
    const s=+a.split(':')[0];const[d,x0,y0,w0,h0]=NAMES[s];const sc=bh*0.62/h0;
    ctx.save();ctx.translate(W/2-w0*sc/2-x0*sc,y+bh*0.19-y0*sc);ctx.scale(sc,sc);ctx.fillStyle='#141414';ctx.fill(new Path2D(d));ctx.restore();y+=bh+40}
  ctx.fillStyle='#000';ctx.textBaseline='middle';ctx.direction='rtl';
  qLines.forEach(l=>{const tw=l.reduce((s,x)=>s+x[1],0);let x=W/2+tw/2;y+=qfs*0.95;
    l.forEach(([t,w])=>{ctx.font=`${qfs}px p${t[1]}`;ctx.textAlign='right';ctx.fillText(t[0],x,y);x-=w});y+=qfs*0.95});
  y+=50;ctx.textAlign='right';ctx.font=`34px ${sysF}`;ctx.fillStyle='#9a8a73';ctx.fillText(name,W-P-20,y);y+=40;
  const ch=tl.length*64+60;ctx.fillStyle='#f2eeea';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(P,y,cw,ch,28);else ctx.rect(P,y,cw,ch);ctx.fill();
  ctx.fillStyle='#111';ctx.font=`36px ${sysF}`;let ty=y+30+32;tl.forEach(l=>{ctx.fillText(l,W-P-40,ty);ty+=64});
  ctx.textAlign='center';ctx.font=`26px ${sysF}`;ctx.fillStyle='#b9ab95';ctx.fillText('مصحف حفص وشعبة',W/2,H-P/2-10);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],'tafsir.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const url=URL.createObjectURL(blob);const lnk=document.createElement('a');lnk.href=url;lnk.download='tafsir.png';document.body.appendChild(lnk);lnk.click();lnk.remove();
}

    const d=document.createElement('div');d.className='res';d.innerHTML=`<span class="qt">${esc(Q.text[k])}</span><small>${esc(ayRef(k))} - الصفحة ${AR(Q.ayahPage[k])}</small>`;
    d.onclick=()=>{closeAll();show(Q.ayahPage[k])};R.appendChild(d);if(++n>=150)break}}
  if(!n)R.innerHTML='<div class="gh">لا نتائج</div>';else if(n>=150)R.insertAdjacentHTML('beforeend','<div class="gh">تُعرض أول ١٥٠ نتيجة</div>');
}

/* ---------- settings ---------- */
function applySettings(){
  document.body.classList.toggle('night',!!S.night);document.body.classList.toggle('nodiff',!S.diffs);
  document.documentElement.style.setProperty('--tsize',S.tsize+'px');
}
function openSettings(){
  aux('الإعدادات',`
    <div class="set"><label>طريقة عرض المعنى والتفسير</label><select id="sMode">
      <option value="bottom" ${S.mode==='bottom'?'selected':''}>نافذة في أسفل الصفحة</option>
      <option value="center" ${S.mode==='center'?'selected':''}>نافذة في وسط الصفحة</option>
      <option value="full" ${S.mode==='full'?'selected':''}>صفحة كاملة</option></select></div>
    <div class="set"><label>التفسير الافتراضي</label><select id="sTaf">${TAFSIRS.map((t,i)=>`<option value="${i}" ${i==S.tafsir?'selected':''}>${t[1]}</option>`).join('')}</select></div>
    <div class="set"><label>حجم خط المعاني والتفسير</label><select id="sSize">${[16,17,19,21,24,27].map(v=>`<option ${v==S.tsize?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="set"><label>الوضع الليلي</label><input type="checkbox" id="sNight" ${S.night?'checked':''} style="width:auto"></div>
    <div class="set"><label>تلوين مواضع خلاف شعبة</label><input type="checkbox" id="sDiff" ${S.diffs?'checked':''} style="width:auto"></div>
    <div class="legend" style="padding:.6em 0">${Object.entries(DIFF_NAMES).map(([c,n])=>`<span><i style="background:var(--c-${c})"></i>${n}</span>`).join('')}</div>
    <div style="color:var(--muted);font-size:15px;line-height:1.8">• ضغطة سريعة على الكلمة: معناها.<br>• ضغطة مطوّلة على الكلمة: خلاف شعبة.<br>• ضغطة على رمز الآية: تفسيرها.<br>• ضغطة مطوّلة على رمز الآية: صفحة التفاسير كاملة.</div>`);
  $('sMode').onchange=e=>{S.mode=e.target.value;save('settings',S)};
  $('sTaf').onchange=e=>{S.tafsir=+e.target.value;tvTaf=null;save('settings',S)};
  $('sSize').onchange=e=>{S.tsize=+e.target.value;save('settings',S);applySettings()};
  $('sNight').onchange=e=>{S.night=e.target.checked;save('settings',S);applySettings()};
  $('sDiff').onchange=e=>{S.diffs=e.target.checked;save('settings',S);applySettings()};
}

/* ---------- overlays & bars ---------- */
function closeAll(keepBars){
  ['sheet','aux'].forEach(id=>$(id).classList.remove('open'));
  ['pop','full','drw','dim'].forEach(id=>$(id).classList.remove('open'));
  $('tmenu').classList.remove('open');
  if(!keepBars){$('top').classList.remove('open');$('bot').classList.remove('open')}
  selectWord(null);
}
const anyOpen=()=>document.querySelector('.sheet.open,#pop.open,#full.open,#drw.open,#lib.open');
function toggleBars(){
  if(anyOpen()){closeAll();return}
  const o=!$('top').classList.contains('open');$('top').classList.toggle('open',o);$('bot').classList.toggle('open',o);
}
$('page').addEventListener('click',toggleBars);
const sl=$('slider');
sl.addEventListener('input',()=>{const p=+sl.value;const b=$('bubble');b.style.display='block';b.textContent=`${AR(p)} — ${sname(surahOfPage(p))}`});
sl.addEventListener('change',()=>{$('bubble').style.display='none';const p=+sl.value;cur=p;show(p).then(()=>{$('top').classList.add('open');$('bot').classList.add('open')})});

/* ---------- navigation ---------- */
let sx=null,sy=null;
addEventListener('touchstart',e=>{if(e.target.closest('.sheet,#pop,#full,#drw,#lib,#bot,#top,.menu')){sx=null;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)show(cur+(dx>0?1:-1));sx=null},{passive:true});
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if($('lib').classList.contains('open')){if(e.key==='ArrowLeft')libStep(1);if(e.key==='ArrowRight')libStep(-1);if(e.key==='Escape')closeLib();return}
  if(e.key==='ArrowLeft')show(cur+1);if(e.key==='ArrowRight')show(cur-1);if(e.key==='Escape')closeAll()});
addEventListener('resize',()=>layout());
init();
</script>
</body>
</html>
