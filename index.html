html,body{margin:0;height:100%;background:var(--edge);overflow:hidden;font-family:var(--sys);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;cursor:pointer;color:inherit}
svg.i{width:1.35em;height:1.35em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
/* ---------- page ---------- */
#page{position:absolute;inset:0;margin:auto;background:var(--paper);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#page.odd{border-radius:0 16px 16px 0;box-shadow:3px 0 0 #f4f0e7,4px 0 0 #d8d1c3,7px 0 0 #f4f0e7,8px 0 0 #d8d1c3,11px 0 0 #f4f0e7,12px 0 0 #cfc7b8}
#page.even{border-radius:16px 0 0 16px;box-shadow:-3px 0 0 #f4f0e7,-4px 0 0 #d8d1c3,-7px 0 0 #f4f0e7,-8px 0 0 #d8d1c3,-11px 0 0 #f4f0e7,-12px 0 0 #cfc7b8}
body.night #page.odd,body.night #page.even{box-shadow:none}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:clamp(14px,2.2vh,21px);padding:.5em 1.6em .1em}
.foot{justify-content:center;padding:.1em 0 .6em}
#lines{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.line{position:relative;display:flex;align-items:center;white-space:nowrap;direction:rtl;color:var(--ink);-webkit-text-stroke:.006em currentColor}
.line.just{justify-content:space-between}
.line.center{justify-content:center}
.line.center .w{margin:0 .07em}
.w{cursor:pointer;border-radius:.15em;line-height:1}
.w.sel{background:var(--sel)!important}
.w.d-h{color:var(--c-h)}.w.d-i{color:var(--c-i)}.w.d-m{color:var(--c-m)}.w.d-w{color:var(--c-w)}.w.d-n{color:var(--c-n)}
body.nodiff .w[class*="d-"]{color:inherit}body.nodiff .dot{display:none}
.w.hl-y{background:var(--hl-y)}.w.hl-g{background:var(--hl-g)}.w.hl-b{background:var(--hl-b)}.w.hl-p{background:var(--hl-p)}.w.hl-o{background:var(--hl-o)}
.num{color:var(--ink)!important;position:relative;z-index:0}
.num canvas.mkf{position:absolute;left:0;top:0;z-index:-1;pointer-events:none}
.ar{width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;margin:0 .15em}
.dot{position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;-webkit-text-stroke:0;pointer-events:none}
.hdr{position:relative;display:flex;align-items:center;justify-content:center}
.hdr img{width:100%;height:100%;display:block;filter:brightness(.86) saturate(1.25) contrast(1.06)}
.hdr.baked img{filter:none}
.hdr svg{position:absolute;height:62%;top:19%;overflow:visible}
.hdr svg path{fill:#141414;stroke:var(--mk,#dcebd2);stroke-width:2;stroke-linejoin:round}
.bsm{display:flex;justify-content:center;align-items:center;font-family:bsml;color:var(--ink);-webkit-text-stroke:.012em var(--paper);paint-order:fill stroke;direction:ltr;unicode-bidi:bidi-override}
/* ---------- bars ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:4;background:var(--ui);color:var(--acc);display:flex;align-items:center;gap:.4em;
  padding:calc(env(safe-area-inset-top,0) + .55em) 1em .55em;border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .2s}
#top.open,#bot.open{transform:none}
#top button{background:none;border:0;padding:.25em .45em;font-size:20px;color:var(--acc)}
#top .sideic{padding:.25em .45em;font-size:20px;color:var(--acc)}
#top>button,#top .sideic{display:inline-flex;align-items:center;justify-content:center;height:2em;line-height:1}
#top>button svg.i,#top .sideic svg.i{display:block}
#sideIc.r .ll,#sideIc.l .rl{display:none}
#top .sp{flex:1;text-align:center;color:var(--muted);font-size:15px}
.cal{position:relative;display:inline-flex;align-items:center;justify-content:center}
.cal b{position:absolute;font-size:10px;top:52%;transform:translateY(-35%);font-weight:700}
#bot{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--ui);border-top:1px solid var(--line);padding:.8em 1.2em calc(.8em + env(safe-area-inset-bottom,0));
  transform:translateY(110%);transition:transform .2s;display:flex;align-items:center;gap:.8em}
/* رقم الصفحة على مؤشر المسطرة */
.slw{flex:1;position:relative;display:flex;align-items:center}
#slTag{position:absolute;top:50%;width:46px;height:24px;margin-top:-12px;line-height:24px;text-align:center;direction:ltr;unicode-bidi:isolate;border-radius:12px;background:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.25);color:#fff;font-size:14px;font-weight:600;pointer-events:none}
#slider{flex:1;width:100%;direction:rtl;-webkit-appearance:none;appearance:none;height:26px;background:transparent}
#slider::-webkit-slider-runnable-track{height:24px;border-radius:12px;background:var(--line)}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:24px;border-radius:12px;background:transparent;margin-top:0}
#slider::-moz-range-thumb{width:46px;height:24px;border:0;background:transparent}
#bubble{position:fixed;bottom:calc(4.4em + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;border-radius:10px;padding:.25em .9em;font-size:15px;display:none;z-index:5}
#here{background:var(--acc);color:#fff;border:0;border-radius:20px;padding:.35em 1em;font-size:15px;display:none;white-space:nowrap}
#here.on{display:block}
/* ---------- generic overlays ---------- */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:6;display:none}
.dim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--ui);color:var(--uitx);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
  padding:1em 1.2em calc(1em + env(safe-area-inset-bottom,0));transform:translateY(110%);transition:transform .22s;z-index:7;max-height:80vh;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet>*{flex:none}.sheet>.bd{flex:1 1 auto;min-height:0}
.hd{display:flex;align-items:center;gap:.5em;margin-bottom:.5em;font-weight:700;font-size:18px}
.hd .sp{flex:1}
.x{border:0;background:none;font-size:24px;color:#999;padding:0 .2em}
.bd{overflow:auto;font-size:var(--tsize,19px);line-height:1.95;-webkit-user-select:text;user-select:text}
.just-t{text-align:justify;text-justify:inter-word}
.k{color:var(--acc);font-weight:700}
.mini{border:1px solid var(--line);background:none;color:var(--acc);border-radius:20px;padding:.15em .9em;font-size:15px}
.pill{appearance:none;-webkit-appearance:none;border:0;background:#ebe7df;color:var(--acc2);border-radius:28px;padding:.45em 2.2em .45em 1.3em;font:inherit;font-size:18px;
  background-image:linear-gradient(45deg,transparent 50%,var(--acc2) 50%),linear-gradient(135deg,var(--acc2) 50%,transparent 50%);background-position:1.0em 55%,1.4em 55%;background-size:.4em .4em;background-repeat:no-repeat}
body.night .pill{background-color:#3a3833}
.tabs{display:flex;gap:.35em;overflow-x:auto;padding-bottom:.4em;margin-bottom:.4em;border-bottom:1px solid var(--line)}
.tabs button{flex:none;border:1px solid var(--line);background:none;border-radius:20px;padding:.2em .9em;font-size:15px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.acts{display:flex;justify-content:space-around;background:#d8d8c4;color:#3a3a2a;padding:.55em .3em;margin:0 -1.2em -1em;border-radius:0 0 18px 18px}
body.night .acts{background:#3a3a30;color:#ddd}
.sheet .acts{margin:.6em -1.2em calc(-1em - env(safe-area-inset-bottom,0));padding-bottom:calc(.55em + env(safe-area-inset-bottom,0));border-radius:0}
.acts button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.15em;font-size:14px;padding:.1em .5em}
.acts button.on{color:var(--acc)}
.shu{margin-top:.2em;padding:.35em .8em;border-radius:10px;background:rgba(77,122,94,.08)}
.qt{font-family:"Amiri Quran",Amiri,serif;font-size:1.15em}
.qv{color:var(--qv)}
.ref{color:var(--ref)}
/* center pop */
#pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:all .18s;z-index:7;
  width:min(92vw,600px);max-height:78vh;background:var(--ui);color:var(--uitx);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);
  display:flex;flex-direction:column;padding:1em 1.2em 1em;overflow:hidden}
#pop.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#pop .top{display:flex;justify-content:center;margin-bottom:.6em}
#pop .bd{flex:1 1 auto;min-height:0}
/* full panel (word) */
#full{position:fixed;inset:0;z-index:7;background:var(--ui);color:var(--uitx);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0) + .8em) 1.2em 0}
#full.open{display:flex}
#full .ay{font-family:"Amiri Quran",Amiri,serif;font-size:24px;line-height:2;text-align:center;color:#8a8a8a;margin:.4em 0}
#full .ay .hw{color:var(--qv)}
#full .big{font-family:"Amiri Quran",Amiri,serif;font-size:64px;text-align:center;color:var(--acc2);margin:.2em 0 .4em}
#full .bd{flex:1;text-align:center}
#full .ctl{display:flex;justify-content:space-around;color:var(--acc2);padding:.6em 0;font-size:20px}
#full .ctl button{background:none;border:0;color:var(--acc2)}
#full .acts{margin:0 -1.2em;border-radius:0;background:var(--acc2);color:#fff;padding-bottom:calc(.6em + env(safe-area-inset-bottom,0))}
/* library */
#lib{position:fixed;inset:0;z-index:8;background:var(--lib);color:var(--uitx);display:none;flex-direction:column;font-family:var(--sys)}
#lib.open{display:flex}
#lib .lh{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0) + .9em) 1.1em .7em;border-bottom:1px solid var(--line)}
#lib .lh .ttl{flex:1;text-align:center;font-weight:700;font-size:21px}
#lib .lh .ref2{color:var(--acc);font-size:19px;min-width:6em;text-align:right;display:flex;align-items:center;gap:.2em;justify-content:flex-start}
#lib .xw{min-width:6em;display:flex;justify-content:flex-end}
#lib .xc{width:42px;height:42px;border-radius:50%;background:#e2dbd1;border:0;color:#6b5a48;font-size:20px;display:flex;align-items:center;justify-content:center}
#lib .lb{flex:1;overflow:auto;padding:1.2em 1.1em 2em;-webkit-overflow-scrolling:touch}
#lib .ayah{text-align:center;direction:rtl;overflow-wrap:break-word;max-width:100%;color:var(--ink);font-size:30px;line-height:2.1;margin:.4em .2em 1.4em;-webkit-text-stroke:.012em currentColor}
#lib .ayah span{margin:0 .05em;display:inline-block}
#libBody{overflow-x:hidden}
.tc{margin-bottom:1.6em}
.tc .tl{display:flex;justify-content:space-between;align-items:center;color:var(--tlab);font-size:18px;padding:0 .6em .45em}
.tc .dots{background:none;border:0;color:var(--acc);font-size:22px;letter-spacing:2px;line-height:1;padding:0 .2em}
.tc .card{background:var(--card);border-radius:18px;padding:1em 1.1em;font-size:var(--tsize,19px);line-height:1.95;text-align:justify;-webkit-user-select:text;user-select:text}
.tc .card .qh{color:var(--qv);font-family:"Amiri Quran",Amiri,serif;border-bottom:1px solid var(--line);padding-bottom:.5em;margin-bottom:.6em}
#lib .lf{display:flex;align-items:center;gap:.6em;padding:.7em 1.1em calc(.7em + env(safe-area-inset-bottom,0));border-top:1px solid var(--line);background:var(--lib)}
#lib .lf .nb{width:3.2em;height:2.6em;border-radius:14px;background:#e6e0d6;border:0;color:var(--acc);font-size:20px}
#lib .lf .cp{flex:1;height:2.6em;border-radius:14px;background:#e6e0d6;border:0;color:var(--acc);font-size:19px}
#lib .lf .fs{background:none;border:0;color:var(--acc);font-size:22px;font-weight:700;width:2.4em}
body.night #lib .lf .nb,body.night #lib .lf .cp,body.night #lib .xc{background:#33312d}
.menu{position:fixed;z-index:9;background:rgba(245,244,242,.98);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:240px;overflow:hidden;display:none;color:#222}
.menu.open{display:block}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:.8em 1.1em;font-size:17px;border-bottom:1px solid #ddd;text-align:right}
.menu button:last-child{border-bottom:0}
.menu .sepr{height:8px;background:#e4e2de}
/* drawer */
#drw{position:fixed;top:0;bottom:0;right:0;width:min(100vw,520px);background:#f3efe9;color:#222;z-index:7;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.18)}
body.night #drw{background:#232220;color:#eee}
#drw.open{transform:none}
#drw .dh{display:flex;align-items:center;gap:.6em;padding:calc(env(safe-area-inset-top,0) + .7em) 1em .7em;border-bottom:1px solid var(--line)}
.seg{flex:1;display:flex;background:#e7e2da;border-radius:12px;padding:3px;max-width:420px;margin:auto}
body.night .seg{background:#33312d}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:.4em .2em;font-size:15px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
body.night .seg button.on{background:#4a4740}
.back{width:40px;height:40px;border-radius:50%;border:0;background:#e7e2da;color:var(--acc);font-size:20px;flex:none}
#drw .db{flex:1;display:flex;min-height:0}
#dlist{flex:1;overflow:auto;padding:0 1em 1em;-webkit-overflow-scrolling:touch}
#jstrip{width:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--acc);font-size:12px;gap:2px;padding:.5em 0}
#jstrip span{cursor:pointer;padding:1px 4px}
.gh{color:#8d7c66;font-size:17px;padding:1.1em .2em .3em}
.row{display:flex;align-items:center;gap:.9em;padding:.65em .1em;border-bottom:1px solid var(--line);cursor:pointer}
.row .n{width:2.5em;height:2.5em;border-radius:50%;background:#e7e2da;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
body.night .row .n{background:#33312d}
.row .n.cur{background:#2f7d3a;color:#fff}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:20px;font-weight:700}
.row .t small{display:block;color:#8d7c66;font-size:14px;margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .del{border:0;background:none;color:#a33;font-size:20px}
#drw .dn{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:.5em 0 calc(.5em + env(safe-area-inset-bottom,0))}
#drw .dn button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:13px;color:#8a8a8a}
#drw .dn button.on{color:var(--acc)}
.kh{border:1px solid var(--line);border-radius:12px;padding:.7em .9em;margin:.7em 0;background:rgba(255,255,255,.5)}
body.night .kh{background:rgba(255,255,255,.04)}
.kh.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.kh h3{margin:0 0 .3em;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.kh .meta{color:#8d7c66;font-size:15px;line-height:1.7}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:.4em 0}
.prog i{display:block;height:100%;background:var(--acc)}
input,select,textarea{font:inherit;padding:.45em .6em;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--uitx);width:100%}
textarea{min-height:8em;-webkit-user-select:text;user-select:text}
.set{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.6em 0;border-bottom:1px solid var(--line);font-size:17px}
.set label{flex:1}.set select{width:auto;min-width:9em}
.legend span{display:inline-block;margin:.15em .4em;font-size:15px}
.legend i{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:middle;margin-left:.3em}
.swatches{display:flex;gap:.8em;justify-content:center;padding:.6em 0}
.swatches button{width:2.4em;height:2.4em;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}
/* tafsir khatma view */
#tview{position:fixed;inset:0;background:var(--paper);color:var(--ink);z-index:3;display:none;flex-direction:column}
#tview.open{display:flex}
#tview .tp{display:flex;align-items:center;gap:.5em;padding:calc(env(safe-area-inset-top,0) + .5em) 1em .4em;border-bottom:1px solid var(--line);color:var(--muted);font-size:16px;flex:none}
#tview .tp .sp{flex:1;text-align:center}
#tview .tabs{padding:.4em 1em;margin:0;flex:none}
#tvBody{overflow:auto;padding:.6em 1.2em 6em;flex:1;-webkit-overflow-scrolling:touch}
.tv-a{font-family:"Amiri Quran",Amiri,serif;font-size:calc(var(--tsize,19px)*1.35);line-height:2.1;margin:.8em 0 .2em;color:var(--ink)}
.tv-a .an{color:var(--acc);font-size:.8em}
.tv-t{font-size:var(--tsize,19px);line-height:1.95;color:var(--uitx);padding:.2em .8em .8em;border-right:3px solid var(--line);text-align:justify}
.tv-h{text-align:center;color:var(--acc);font-family:"Amiri Quran",Amiri,serif;font-size:1.4em;margin:.6em 0}
#tvBtns{position:fixed;left:1em;bottom:calc(1em + env(safe-area-inset-bottom,0));display:flex;gap:.5em;z-index:3}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:.55em 1.3em;border-radius:10px;z-index:20;display:none;font-size:16px}
.res{padding:.6em .2em;border-bottom:1px solid var(--line);cursor:pointer}
.res .qt{display:block;color:var(--ink)}.res small{color:var(--muted)}
.tx.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:10;line-clamp:10;overflow:hidden}
.more{display:inline-flex;align-items:center;gap:.25em;margin-top:.35em;background:none;border:0;padding:.2em 0;color:var(--acc);font-size:.85em;font-family:inherit;cursor:pointer}
.more svg{width:.7em;height:.7em;transition:transform .2s}.more.up svg{transform:rotate(180deg)}
body.night .more{color:#8fbf8f}
.jn{font-size:.8em;color:var(--muted);margin-bottom:.4em}

/* ---------- صفحة البحث ---------- */
#srch{position:fixed;inset:0;z-index:9;background:transparent;color:var(--uitx);display:none;flex-direction:column;font-family:var(--sys)}
#srch.open{display:flex}
#srch .sh{display:flex;align-items:center;gap:.8em;padding:calc(env(safe-area-inset-top,0px) + .7em) 1em .7em;border-bottom:1px solid var(--line);background:var(--ui)}
#srch .sbox{flex:1;display:flex;align-items:center;gap:.4em;background:none;padding:0 .2em;height:42px}
#srch .sbox .i{width:22px;height:22px;color:var(--muted);flex:none}
#srch input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:18px;color:var(--uitx);padding:0;-webkit-appearance:none}
#srch input::-webkit-search-cancel-button{display:none}
#srch .sclr{flex:none;width:24px;height:24px;border-radius:50%;border:0;background:var(--muted);color:var(--ui);font-size:17px;line-height:22px;padding:0;visibility:hidden}
#srch .scancel{flex:none;background:none;border:0;color:var(--acc);font:inherit;font-size:18px;padding:.2em 0}
#srch .sbody{background:rgba(0,0,0,.38);transition:background .2s}
#srch .sbody.has{background:var(--ui)}
#srch .sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1em 1em calc(1em + env(safe-area-inset-bottom,0px))}
#srch .srh{font-weight:700;font-size:22px;margin:.1em .2em .6em}
#srch .scard{background:var(--paper);border-radius:16px;padding:0 1.2em}
#srch .sr{padding:.9em 0;border-bottom:1px solid var(--line);cursor:pointer}
#srch .sr:last-child{border-bottom:0}
#srch .srt{display:flex;justify-content:space-between;font-size:17px;margin-bottom:.15em}
#srch .srt .pg{color:var(--muted)}
#srch .stx{font-family:"Amiri Quran",Amiri,serif;font-weight:400;font-size:25px;line-height:2.05;color:#a3906f}
body.night #srch .sbox{background:rgba(255,255,255,.08)}

<script>
const FONT_BASE='https://raw.githubusercontent.com/zonetecde/mushaf-layout/refs/heads/v2/fonts/QPC2/';
const TAF_BASE=['https://raw.githubusercontent.com/spa5k/tafsir_api/main/tafsir/','https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir/'];
const TAFSIRS=[['ar-tafsir-al-mukhtasar','المختصر'],['my','تفسيري'],['ar-tafsir-muyassar','التفسير الميسر'],['ar-tafseer-al-saddi','تفسير السعدي'],
  ['ar-tafsir-ibn-kathir','تفسير ابن كثير'],['ar-tafsir-al-baghawi','تفسير البغوي'],['ar-tafsir-al-tabari','تفسير الطبري']];
/* تفسيري: ملف my-tafsir.json بجانب التطبيق — يظهر خياره فقط في الآيات التي لها تفسير فيه */
const MYI=TAFSIRS.findIndex(t=>t[0]==='my');let MYT=null,myLoading=null;
function loadMy(){return myLoading||(myLoading=fetch('my-tafsir.json').then(r=>r.ok?r.json():null).then(j=>{MYT=j||{e:{},a:{}};return MYT}).catch(()=>{MYT={e:{},a:{}};return MYT}))}
const myKey=k=>!MYT?null:(MYT.e[k]!=null?k:(MYT.a[k]||null));
const hasMy=k=>!!myKey(k);
const DIFF_NAMES={h:'حرف يخالف حفصًا',i:'إدغام كامل',m:'إمالة وصلًا ووقفًا',w:'إمالة وقفًا فقط',n:'إدغام ناقص بغنة'};
const KH=[['hifz','ختمة الحفظ'],['tilawa','ختمة التلاوة'],['tafsir','ختمة التفسير']];
const HLC=[['y','أصفر'],['g','أخضر'],['b','أزرق'],['p','وردي'],['o','برتقالي']];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let Q,M,LAYOUT,NAMES={},DIFFS={},QUARTERS=[],AYTOK={},cur=1,surahFirst={},loaded={},selEl=null;

/* ---------- storage ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=Object.assign({tafsir:0,tsize:19,night:false,diffs:true,mode:'bottom'},load('settings',{}));
/* بعد نقل «تفسيري» إلى المرتبة الثانية: يبقى التفسير الافتراضي المحفوظ كما اختاره المستخدم */
if(S.tord!==2){const OLD=['ar-tafsir-al-mukhtasar','ar-tafsir-muyassar','ar-tafseer-al-saddi','ar-tafsir-ibn-kathir','ar-tafsir-al-baghawi','ar-tafsir-al-tabari','my'];
  S.tafsir=Math.max(0,TAFSIRS.findIndex(t=>t[0]===OLD[S.tafsir]));S.tord=2;save('settings',S)}
let K=load('khatmas',{active:'hifz',hifz:{page:1,wird:1},tilawa:{page:1,wird:20},tafsir:{page:1,wird:2}});
let BM=load('bookmarks',[]),HL=load('highlights',{}),NT=load('notes',{});
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1700)}

/* ---------- fonts ---------- */
function loadFont(fam,url){
  if(loaded[fam])return loaded[fam];
  const f=new FontFace(fam,`url(${url})`);
  loaded[fam]=f.load().then(x=>{document.fonts.add(x);return x}).catch(e=>{delete loaded[fam];throw e});
  return loaded[fam];
}
const pageFont=p=>loadFont('p'+p,FONT_BASE+'p'+String(p).padStart(3,'0')+'.woff2');

/* ---------- helpers ---------- */
const sname=s=>Q.surahs[s-1][0];
const ayRef=k=>{const[s,a]=k.split(':');return `${sname(s)}: ${AR(a)}`};
function juzOf(p){let j=1;Q.juzPages.forEach((s,i)=>{if(p>=s)j=i+1});return j}
function firstKey(p){for(const l of LAYOUT[p-1])if(l.w)for(const w of l.w)if(w[0])return w[0];return '1:1:0'}
const surahOfPage=p=>+firstKey(p).split(':')[0];
const ayahOf=k=>k.split('|')[0].split(':').slice(0,2).join(':');
function nextAyah(k,d){let[s,a]=k.split(':').map(Number);a+=d;
  if(a<1){if(s===1)return null;s--;a=Q.surahs[s-1][2]}else if(a>Q.surahs[s-1][2]){if(s===114)return null;s++;a=1}return s+':'+a}
/* خانة التفسير: يظهر منها ١٠ أسطر، والباقي بزر «المزيد» */
const CHEV='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.6 5 6.6 8 3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function setTaf(el,t,empty){
  const jm=(t||'').match(JOINT_RE),h=fmtTafsir(stripJoint(t));if(!h){el.textContent=empty;return}
  el.innerHTML=(jm?`<div class="jn">${esc(jm[0].trim())}</div>`:'')+`<div class="tx clamp">${h}</div>`;
  const tx=el.querySelector('.tx');
  requestAnimationFrame(()=>{if(tx.scrollHeight<=tx.clientHeight+4){tx.classList.remove('clamp');return}
    const b=document.createElement('button');b.className='more';b.innerHTML='المزيد '+CHEV;
    b.onclick=ev=>{ev.stopPropagation();const open=tx.classList.toggle('clamp');b.innerHTML=(open?'المزيد ':'أقل ')+CHEV;b.classList.toggle('up',!open);
      if(open){const r=el.getBoundingClientRect();if(r.top<0)el.scrollIntoView({block:'start',behavior:'smooth'})}};
    el.appendChild(b)});
}
/* الآيات في التفسير: آية واحدة بلا رقم، وآيات متتالية بأرقامها بين قوسين (١) (٢) */
function quoteMarks(t){
  const re=/\s*(?:۝\s*([٠-٩0-9]+)|([٠-٩0-9]+)\s*۝|\(\s*([٠-٩0-9]+)\s*\))/g;
  const toAr=n=>n.replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  return (t||'').replace(/﴿([^﴾]*)﴾/g,(m,b)=>{
    const ms=[...b.matchAll(re)];if(!ms.length)return m;
    const e=ms[ms.length-1];const atEnd=e.index+e[0].length>=b.replace(/\s+$/,'').length;
    if(ms.length===1&&atEnd)return '﴿'+b.replace(re,'').trim()+'﴾';
    return '﴿'+b.replace(re,(x,a1,a2,a3)=>' ('+toAr(a1||a2||a3)+')').replace(/\s+/g,' ').trim()+'﴾';
  });
}
function fmtTafsir(t){
  let note='';t=(t||'').replace(JOINT_RE,m=>{note=`<div class="jn">${esc(m.trim())}</div>`;return ''});
  let h=esc(t);
  h=h.replace(/﴿[^﴾]*﴾|\{[^}\n]{2,400}\}/g,m=>`<span class="qv">${m}</span>`).replace(/\[[^\]\n]{1,40}\]/g,m=>`<span class="ref">${m}</span>`);
  return note+h.replace(/\n+/g,'<br>');
}

/* ---------- تصحيحات توزيع الأسطر لتطابق طبعة المجمع في تطبيق آية ----------
   كل سطر: [رقم الصفحة، مفتاح الكلمة، الاتجاه]
   الاتجاه 1 = تنتقل الكلمة إلى أول السطر التالي، و -1 = تنتقل إلى آخر السطر السابق */
const LINE_FIXES=[
  [177,'8:6:10',1],   // الأنفال ٦: «وَهُمۡ» إلى أول السطر التالي
  [443,'36:52@الرحمن',1],   // يس ٥٢: «ٱلرَّحۡمَٰنُ» إلى أول السطر التالي
];
/* مفتاح بصيغة «سورة:آية@كلمة» يُحوَّل إلى رقم الكلمة في الآية */
function fixKey(key){if(!key.includes('@'))return key;const[sa,w]=key.split('@');const ws=(Q.text[sa]||'').split(' ');
  const i=ws.findIndex(x=>skel(x)===skel(w));return i<0?'':sa+':'+i}
function applyLineFixes(){
  LINE_FIXES.forEach(([p,key0,dir])=>{
    const key=fixKey(key0);const pg=LAYOUT[p-1];if(!pg||!key)return;
    const txt=pg.filter(l=>l.w);
    const has=w=>w[0]&&w[0].split('|').includes(key);
    const li=txt.findIndex(l=>l.w.some(has));if(li<0)return;
    const from=txt[li],to=txt[li+dir];if(!to)return;
    const wi=from.w.findIndex(has);
    if(dir===1&&wi===from.w.length-1)to.w.unshift(from.w.pop());
    else if(dir===-1&&wi===0)to.w.push(from.w.shift());
  });
}

/* ---------- init ---------- */
async function init(){
  try{
    [Q,M,LAYOUT,NAMES]=await Promise.all(['quran.json','meanings.json','layout.json','surah-names.json']
      .map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()})));
  }catch(e){$('msg').textContent='تعذّر تحميل: '+e.message;return}
  loadMy();
  try{const r=await fetch('diffs.json');if(r.ok)DIFFS=await r.json()}catch(e){}
  try{const r=await fetch('quarters.json');if(r.ok)QUARTERS=await r.json()}catch(e){}
  try{await loadFont('bsml',FONT_BASE.replace('QPC2/','QPC1/')+'QPC1BSML.ttf')}catch(e){}
  applyLineFixes();
  LAYOUT.forEach((pg,i)=>{let last=null;pg.forEach(l=>{
    if(l.h&&!surahFirst[l.h])surahFirst[l.h]=i+1;
    if(l.w)l.w.forEach(([k,g])=>{const parts=g.split(' ');
      if(k){last=ayahOf(k);(AYTOK[last]=AYTOK[last]||[]).push([parts[0],i+1,k]);parts.slice(1).forEach(m=>AYTOK[last].push([m,i+1,'']))}
      else if(last)parts.forEach(m=>AYTOK[last].push([m,i+1,'']))})})});
  applySettings();
  try{$('hday').textContent=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric'}).format(new Date())}catch(e){}
  $('msg').remove();$('page').hidden=false;
  K.active='hifz';save('khatmas',K);
  await document.fonts.ready;
  show(K.hifz.page||1);
}

/* ---------- page ---------- */
/* العرض بصفحتين في الآيباد أفقيًا: الفردية يمينًا والزوجية يسارًا */
const isSpread=()=>innerWidth>innerHeight&&Math.min(innerWidth,innerHeight)>=600;
let COMP=null;   // الصفحة اليسرى المرافقة في العرض بصفحتين
async function show(p){
  p=Math.max(1,Math.min(604,p|0||1));
  if(isSpread()&&p%2===0)p=(p===cur+1)?Math.min(603,p+1):p-1;   // «التالية» من صفحة فردية تعني الصفحتين التاليتين
  cur=p;closeAll(true);
  if(K.active==='hifz'){K.hifz.page=p;save('khatmas',K)}
  try{await pageFont(p);if(isSpread()&&p<604)await pageFont(p+1)}catch(e){$('lines').textContent='تعذّر تحميل خط الصفحة — تأكد من الاتصال بالإنترنت';return}
  if(p!==cur)return;
  if(drag)dragReset();PRE={};
  if(COMP){COMP.remove();COMP=null}
  renderPage(p);
  if(isSpread()&&p<604){COMP=prerenderOne(p+1,p);delete PRE[p+1];bindPageEl(COMP);$('page').after(COMP)}
  [p+1,p-1,p+2,p+3,p-2].forEach(n=>{if(n>=1&&n<=604)pageFont(n).catch(()=>{})});
  schedulePre();
}
/* إطار اسم السورة: يُفتَّح وسطه (موضع الاسم) بلون يناسب لون الصفحة */
let BANNER_URL='banner.png',BANNER_BAKED=false,BANNER_FOR='',bannerImg=null;
async function buildBanner(){
  const mk=getComputedStyle(document.documentElement).getPropertyValue('--mk').trim()||'#e6f0de';if(mk===BANNER_FOR)return;BANNER_FOR=mk;
  try{
    if(!bannerImg)bannerImg=await new Promise((r,j)=>{const im=new Image();im.onload=()=>r(im);im.onerror=j;im.src='banner.png'});
    const im=bannerImg,W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
    const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,W,H),px=d.data;
    /* نفس مرشح العرض السابق: سطوع ٠٫٨٦، تشبع ١٫٢٥، تباين ١٫٠٦ */
    for(let i=0;i<px.length;i+=4){let r=px[i]*.86,g=px[i+1]*.86,b=px[i+2]*.86;const l=.2126*r+.7152*g+.0722*b;
      r=l+(r-l)*1.25;g=l+(g-l)*1.25;b=l+(b-l)*1.25;px[i]=(r-128)*1.06+128;px[i+1]=(g-128)*1.06+128;px[i+2]=(b-128)*1.06+128}
    /* تعبئة وسط الإطار انطلاقًا من مركزه */

/* أسطر تتوسط الصفحة كما في تطبيق آية (تُعرف بآخر آية تنتهي في السطر) */
const CENTER_LINES=new Set(['107:7']);   // آخر سطر في سورة الماعون
function lineEndAyah(l){const n=l.querySelectorAll('.w');const last=n[n.length-1];return last&&last.classList.contains('num')?last.dataset.a:''}
function layout(){
  const pg=$('page'),box=$('lines');if(!box.children.length)return;
  const vw=innerWidth,vh=innerHeight;
  /* مقاسات مأخوذة من صفحة تطبيق آية: هامش ٧٫٥٪ من كل جهة، والمسافة بين الأسطر ١١٫١٪ من عرض السطر */
  const phone=vw<600;
  const MARG=phone?0.035:0.075,PITCH=0.111;   // الجوال: هوامش أضيق كما في آية
  const barH=$('juz').parentElement.offsetHeight+$('pno').offsetHeight;
  const spread=isSpread();
  const gutter=phone?0:Math.max(12,Math.round(vw*(spread?0.04:0.05)));
  let W=spread?(vw-gutter)/2:vw-gutter;
  const need=w=>barH+16+15*(w*(1-2*MARG)*PITCH);      // الطول اللازم لصفحة بهذا العرض
  if(need(W)>vh)W=(vh-barH-16)/(15*(1-2*MARG)*PITCH);  // الشاشة أقصر: نصغّر الصفحة كلها بالنسبة نفسها
  const side=!spread&&W>=vw-gutter-1;

  if(spread){const odd=cur%2===1;pg.style.marginLeft=odd?(vw/2)+'px':'auto';pg.style.marginRight=odd?'auto':(vw/2)+'px'}
  else if(side){const odd=cur%2===1;pg.style.marginLeft=odd?'0':'auto';pg.style.marginRight=odd?'auto':'0'}
  else{pg.style.marginLeft=pg.style.marginRight='auto'}
  const lines=[...box.children];
  const margin=Math.round(W*MARG),lineW=W-2*margin;
  /* الشاشة أطول من الصفحة (كالجوال): تتسع المسافة بين الأسطر لتملأ الطول كله كما في آية */
  const pitch=Math.max(lineW*PITCH,(vh-barH-16)/15);
  document.querySelectorAll('#page .bar').forEach(b=>{b.style.paddingLeft=b.style.paddingRight=margin+'px'});
  const centeredPage=cur<=2;
  let fs=pitch/2;box.style.fontSize=fs+'px';
  const txt=lines.filter(l=>l.classList.contains('line'));
  const measure=()=>{txt.forEach(l=>{l.classList.remove('just','center');l.style.fontSize='';l.style.width='auto';l.querySelectorAll('.w').forEach(w=>w.style.transform='')});
    return new Map(txt.map(l=>[l,l.scrollWidth]))};
  let nats=measure(),maxNat=Math.max(...nats.values(),1);
  /* حجم الخط: أطول سطر يملأ ٩٦٪ من العرض، مع حدّ أعلى يترك فراغًا مريحًا بين الأسطر */
  if(!centeredPage&&txt.length){
    const fit=Math.min(fs*lineW*0.96/maxNat,pitch/1.9);
    if(Math.abs(fit-fs)>0.2){fs=fit;box.style.fontSize=fs+'px';nats=measure();maxNat=Math.max(...nats.values(),1)}
  }
  lines.forEach(l=>{
    l.style.height=pitch+'px';
    if(l.classList.contains('hdr')){const bh=lineW*135/1200;l.style.width=lineW+'px';l.style.height=bh+'px';l.style.margin=Math.max(0,(pitch-bh)/2)+'px 0'}
    else if(l.classList.contains('bsm')){l.style.fontSize=fs*0.95+'px'}
    else{
      let nat=nats.get(l);
      const isCenter=centeredPage||nat<maxNat*0.72||CENTER_LINES.has(lineEndAyah(l));
      l.classList.add(isCenter?'center':'just');
      l.style.width=lineW+'px';
      if(nat>lineW){l.style.fontSize=(fs*lineW/nat*0.995)+'px';nat=lineW}
      /* تمديد أفقي خفيف جدًا للأسطر التي فيها فراغ واضح */
      if(!isCenter){
        const room=lineW*0.97-nat;
        if(room>lineW*0.02){const words=[...l.querySelectorAll('.w:not(.num)')],wsum=words.reduce((t,w)=>t+w.offsetWidth,0);
          const sc=Math.min(1.05,1+room/Math.max(wsum,1));
          if(sc>1.01)words.forEach(w=>w.style.transform=`scaleX(${sc.toFixed(3)})`)}
      }
      const dt=l.querySelector('.dot');
      if(dt){const off=-(margin/2)-3.5;dt.style.right=dt.style.left='';if(cur%2===1)dt.style.right=off+'px';else dt.style.left=off+'px'}
    }
  });

}
/* تلوين وسط رموز الآيات: يُرسم الرمز نفسه على لوحة خفية، ويُعرف داخله من شكله،

function fillMarkers(root){

  const mk=(getComputedStyle(document.documentElement).getPropertyValue('--mk').trim()||'#e6f0de').replace('#','');

  const dpr=Math.min(3,window.devicePixelRatio||1);

    const txt=n.textContent;
    const cs=getComputedStyle(n),fsz=parseFloat(cs.fontSize),w=n.offsetWidth,h=n.offsetHeight;
    const sig=[txt,fsz,w,h,mk].join('|'),old=n.querySelector('canvas.mkf');
    if(old&&old.dataset.sig===sig)return;   // لم يتغير شيء
    n.querySelectorAll('canvas.mkf').forEach(c=>c.remove());
    if(!txt.trim()||!w||!h||!fsz)return;

    const inner=comps.filter(k=>!k.edge);if(!inner.length)return;
    const big=inner.reduce((a,b)=>b.cnt>a.cnt?b:a);

/* ---------- tafsir ---------- */
/* ---------- تقسيم التفسير المجمّع: كل آية تأخذ ما يشرحها فقط ---------- */
const skel=s=>(s||'').normalize('NFKD').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'')
  .replace(/[اأإآٱءئؤوىيٰ]/g,'').replace(/ة/g,'ه').replace(/[^\u0621-\u064A]/g,'');
let QSK=null,QSKS={};const JOINT={};
function qSkel(){if(QSK)return QSK;const src=Q.plain||Q.text||{};const parts=[];
  for(const k in src){const s=skel(src[k]);QSKS[k]=s;parts.push(s)}QSK='|'+parts.join('|')+'|';return QSK}
/* هيكل النص مع خريطة ترجع كل حرف إلى موضعه في الأصل */
function skelMap(t){let s='';const m=[];for(let i=0;i<t.length;i++){const c=skel(t[i]);for(const x of c){s+=x;m.push(i)}}return{s,m}}
const bare=s=>s.normalize('NFKD').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا');
const LEAD_RE=/(?:^|[\s(])(?:[وف]?(?:ب)?قوله|تعالى|تعالي|ذكره|تاويل|ثم قال|وقال|فقال|يقول)(?=[\s:،])[^\n.؟!]{0,30}$/;
/* الآيات المقتبسة بين قوسين عاديين ( ) تصير بأقواس المصحف ﴿ ﴾ */
function parenToQuran(t){
  const all=qSkel();
  return t.replace(/\(([^()\n]{3,700})\)/g,(m,x)=>{
    if(/^[\s٠-٩0-9\/\-–،,.:]+$/.test(x))return m;
    const parts=x.split(/\s*\*\s*/).map(skel).filter(Boolean);
    const ok=parts.length&&parts[0].length>=(parts.length>1?4:7)&&parts.join('').length>=7&&parts.every(p=>p.length>=3&&all.includes(p));
    return ok?'﴿'+x.trim()+'﴾':m});
}
/* تنسيق علامات التنصيص " ": لا فراغ داخلها، وفراغ واحد خارجها */
function fixQuotes(t){
  return t.split('\n').map(line=>{
    const n=(line.match(/"/g)||[]).length;if(!n||n%2)return line;
    let open=true;
    return line.replace(/\s*"\s*/g,(m,off,str)=>{const r=open?' "':'" ';open=!open;return r})
      .replace(/^ /,'').replace(/" ([،.:؛؟!)\]﴾,])/g,'"$1').replace(/([(\[﴿]) "/g,'$1"').replace(/ {2,}/g,' ').trim();
  }).join('\n');
}
/* حذف سطور العنوان في أول السورة: «تفسير سورة كذا»، «وهي مكية»، البسملة */
function stripHead(seg){const ls=seg.split('\n');
  while(ls.length){const l=ls[0].trim(),k=skel(l);
    if(!l||l.replace(/[*\s]/g,'')===''||(k.length<28&&/^(تفسر|سره|بسملله|همك|همدن|مكه|مدنه)/.test(k)))ls.shift();else break}
  return ls.join('\n')}
/* إن دخل في النص آخرُ تفسير السورة السابقة: نبدأ من عنوان «تفسير سورة كذا» */
const preCut=x=>{const m=[...x.matchAll(/(^|\n)[^\n]{0,100}(?=\n|$)/g)].filter(m=>m.index>0&&/^(تفسرسره|تفسرلسره)/.test(skel(m[0])));return m.length?x.slice(m[m.length-1].index):x};
/* الآية المقتبسة في أول الموضع إن امتدت إلى آيات لها مواضع مستقلة: تُقصر على آيات هذا الموضع */
function trimLead(seg,su,from,to){
  const q=seg.match(/﴿([^﴾]*)﴾/);if(!q||q.index>160)return seg;
  const body=q[1];let cut=-1;
  const nums=[...body.matchAll(/\(([٠-٩0-9]+)\)/g)];
  if(nums.length){const m=nums.find(m=>+m[1].replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))===to);if(m&&m!==nums[nums.length-1])cut=m.index+m[0].length}
  else{let need='';for(let j=from;j<=to;j++)need+=QSKS[su+':'+j]||'';
    const M=skelMap(body);if(M.s.length>need.length+2&&M.s.startsWith(need)&&need.length){let i=M.m[need.length-1]+1;while(i<body.length&&body[i]!==' ')i++;cut=i}}
  if(cut<0)return seg;
  return seg.slice(0,q.index+1)+body.slice(0,cut).trim()+'﴾'+seg.slice(q.index+q[0].length);
}
function splitTafsirForAyah(t,su,ay){
  delete JOINT[su+':'+ay];
  if(!t||t.length<300||!Q)return t;
  const cnt=Q.surahs[su-1]?.[2]||300;qSkel();
  const sk=j=>QSKS[su+':'+j]||'';
  const lo=Math.max(1,ay-60),hi=Math.min(cnt,ay+60);
  const ctx=pos=>{const back=t.lastIndexOf('\n',pos-1)+1;const pre=t.slice(Math.max(back,pos-60),pos);
    if(LEAD_RE.test(bare(pre)))return 3;
    return skel(t.slice(back,pos)).replace(/^و/,'')===''?2:0};
  const cands=[];const spans=[];
  /* ١) الآيات المقتبسة بين ﴿ ﴾ */
  for(const q of t.matchAll(/﴿([^﴾]{2,2500})﴾|\(([^()\n]{3,700})\)/g)){
    const body=q[1]||q[2];spans.push([q.index,q.index+q[0].length]);
    const c=ctx(q.index);
    const num=body.match(/\(([٠-٩0-9]+)\)/);
    if(num){if(q[2])continue;   // عنوان فيه الآيات بأرقامها (الطبري): يبدأ موضع أول آية فيه
      const n=+num[1].replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const p0=skel(body.slice(0,num.index)).slice(0,14);let fj=0;
      for(let j=Math.max(1,n-12);j<=n;j++){const a=sk(j);if(a&&p0&&(a.startsWith(p0)||p0.startsWith(a))){fj=j;break}}
      if(fj&&fj>=lo&&fj<=hi)cands.push({j:fj,pos:q.index,sc:Math.max(c,2)+2});
      continue}
    const s=skel(body.split(/\s*\*\s*/)[0]);if(s.length<(q[2]?7:3))continue;
    const p=s.slice(0,Math.min(s.length,14));const hits=[];
    for(let j=lo;j<=hi;j++){const a=sk(j);if(a&&((a.startsWith(p)&&(p.length>=7||a.length<=p.length+2))||(a.length>=5&&s.startsWith(a))))hits.push(j)}
    if(!hits.length&&c>=2&&p.length>=4&&p.length<7){   // مقطع قصير من أول الآية بعد «وقوله:»
      for(let j=lo;j<=hi;j++)if(sk(j).startsWith(p))hits.push(j);
      if(hits.length!==1)hits.length=0}
    if(!hits.length&&c>=2&&s.length>=8){   // جزء من وسط الآية بعد «وقوله:» ونحوها
      for(let j=lo;j<=hi;j++)if(sk(j).includes(s.slice(0,Math.min(s.length,20))))hits.push(j);
      if(hits.length===1){cands.push({j:hits[0],pos:q.index,sc:c});continue}
      hits.length=0}
    if(!hits.length||hits.length>3)continue;
    hits.forEach(j=>cands.push({j,pos:q.index,sc:c+1}));
  }
  /* ٢) آيات مذكورة بلا أقواس في أول السطر أو بعد «قوله/قال تعالى» */
  const inQ=pos=>spans.some(([a,b])=>pos>=a&&pos<b);
  const M=skelMap(t);
  for(let j=lo;j<=hi;j++){const a=sk(j);const p=a.slice(0,Math.min(a.length,16));if(p.length<10)continue;
    let i=-1,n=0;while((i=M.s.indexOf(p,i+1))>=0&&n<6){n++;const pos=M.m[i];if(inQ(pos))continue;
      const c=ctx(pos);if(c)cands.push({j,pos,sc:c})}}
  if(!cands.length){const x=stripHead(preCut(t)).trim();return x||t}
  /* ٣) أفضل سلسلة متصاعدة في رقم الآية وفي الموضع معًا */
  cands.sort((x,y)=>x.pos-y.pos||x.j-y.j);
  const dp=[],pr=[];let best=-1;
  cands.forEach((c,i)=>{const own=1+0.4*c.sc;dp[i]=own;pr[i]=-1;
    for(let k=0;k<i;k++){const d=cands[k];if(d.j<c.j&&d.pos<c.pos){const g=c.j-d.j-1;const v=dp[k]+own-0.3*g+(g===0?0.5:0);if(v>dp[i]){dp[i]=v;pr[i]=k}}}
    if(best<0||dp[i]>dp[best])best=i});
  const marks=[];for(let i=best;i>=0;i=pr[i])marks.unshift({j:cands[i].j,pos:cands[i].pos});
  if(marks.every(m=>m.j===ay)){delete JOINT[su+':'+ay];return t}   // تفسير خاص بهذه الآية وحدها
  /* بداية كل موضع: نرجع إلى «وقوله:» ونحوها، أو إلى أول السطر إن كانت قريبة منه */
  let prevEnd=0;
  marks.forEach(mk=>{let s=mk.pos;const back=t.lastIndexOf('\n',s-1);const from=Math.max(back+1,s-70,prevEnd);const cut=t.slice(from,s);
    const m=cut.search(/(?:وَ?قَوْلُهُ|وَ?قوله|وَقَالَ تَعَالَى|يَقُولُ تَعَالَى|قال تعالى|يقول تعالى|القول في تأويل|ثُمَّ قَالَ|ثم قال)[^\n]*$/);
    if(m>=0)s=from+m;
    else{const b=Math.max(cut.lastIndexOf('.'),cut.lastIndexOf('؟'),cut.lastIndexOf('!'));const tail=cut.slice(b+1);

    mk.s=s;prevEnd=mk.pos+1});
  const tidy=x=>x.replace(/\n[^\n]{0,8}آخر تفسير[^\n]*\s*$/,'').replace(/(\n[\s*]*)+$/,'').trim().replace(/[\s،,؛:\-–]+$/,'').replace(/([^.؟!»"﴾)])$/,'$1.');
  let k=-1;for(let n=0;n<marks.length;n++)if(marks[n].j<=ay)k=n;
  if(k<0){const seg=stripHead(preCut(t.slice(0,marks[0].s))).trim();return seg.length>40?tidy(seg):t}   // الآيات قبل أول موضع معروف
  if(marks[k].j<ay)JOINT[su+':'+ay]=marks[k].j;else delete JOINT[su+':'+ay];
  const start=(k===0&&(marks[0].j===1||stripHead(preCut(t.slice(0,marks[0].s))).trim().length<40))?0:marks[k].s;
  const end=k+1<marks.length?marks[k+1].s:t.length;

  if(k+1<marks.length)seg=trimLead(seg,su,marks[k].j,marks[k+1].j-1);

}

/* تنظيف تفاسير الطبري وابن كثير والبغوي من حواشي المحققين والأقواس المربعة */
const CLEAN_TAF=new Set(['ar-tafsir-al-tabari','ar-tafsir-ibn-kathir','ar-tafsir-al-baghawi']);
/* حذف إحالات الآيات إلى السور مثل [المدثر: ٤٢-٤٣] من جميع التفاسير */
function stripRefs(t){return t
  .replace(/\(\s*\(/g,'(').replace(/\)\s*\)/g,')')                       // (( )) تصير ( )
  .replace(/[ \t]*\[\s*(?:سورة\s*)?[^\[\]\n:]{2,30}?\s*:\s*[٠-٩0-9]+(?:\s*[-–،,و]\s*[٠-٩0-9]+)*\s*\]/g,'')
  .replace(/[ \t]+([،.:؛؟!)﴾])/g,'$1')}
function cleanTafsir(slug,t){
  t=stripRefs(t)
    .replace(/\{\s*([^{}\[\]\n]{1,600}?)\s*\]/g,'﴿$1﴾').replace(/\[\s*([^{}\[\]\n]{1,600}?)\s*\}/g,'﴿$1﴾') // أقواس مختلطة { ] و [ }
    .replace(/\{\s*([^{}\n]{1,600}?)\s*\}/g,'﴿$1﴾')                                   // أقواس الآيات { } تصير بأقواس المصحف ﴿ ﴾
    .replace(/[ \t]*\((?:سورة\s*)?[^()\n]{1,25}?\s*:\s*[٠-٩0-9]+(?:\s*[-–،,]\s*[٠-٩0-9]+)*\s*\)/g,'') // (البقرة: ٢٥)
    .replace(/[ \t]*\(\s*[٠-٩0-9]+(?:\s*[-–،,]\s*[٠-٩0-9]+)*\s*[-–]\s*[^()\n٠-٩0-9]{2,20}\)/g,'')      // (٨٧-الحجر)
    .replace(/[ \t]*\(\s*(?:رقم\s*:?\s*)?[٠-٩0-9]+(?:\s*[\/\-–،,]\s*[٠-٩0-9]+)*\s*\)/g,'');         // أرقام المراجع (٥/١٤١) و(٨١٠)

  return t
    .replace(/[ \t]*\[\[[\s\S]*?\]\]/g,'')                                   // حواشي المحقق: تُحذف كلها
    .replace(/[ \t]*\[[^\[\]\n]{1,40}?:\s*[٠-٩0-9]+(?:\s*[-–،,]\s*[٠-٩0-9]+)*\s*\]/g,'') // إحالات السور مثل [البقرة: ٢١٦]
    .replace(/\[([^\[\]]*)\]/g,'$1')                                          // الزيادات: تبقى الكلمة بلا أقواس
    .replace(/[\[\]]/g,'')                                                    // أي قوس مربع شارد
    .replace(/[ \t]{2,}/g,' ').replace(/ +([،.:؛؟!)﴾])/g,'$1').replace(/ +\n/g,'\n');

const tafCache={},tafSplit={};

function wrapLines(ctx,words,maxW,sep){const out=[];let line='';
  words.forEach(w=>{const t=line?line+sep+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});if(line)out.push(line);return out}
/* نص التفسير في الصورة: الآيات بخط المصحف ولونه، ورقم الآية داخل علامتها كما في التطبيق */
function richLines(ctx,txt,maxW,sysF){
  const FT=`36px ${sysF}`,FQ=FT,CT='#111',CQ='#8b1f1f',CR='#a09484';
  txt=txt.replace(/۝\s+([٠-٩]+)/g,'۝$1');
  const words=[];
  txt.split(/\n+/).forEach((para,pi)=>{if(!para.trim())return;if(words.length)words.push({br:1});
    let mode=0;   // 0 نص، 1 آية، 2 إحالة
    para.trim().split(/\s+/).forEach(t=>{
      let m=mode;if(t.includes('﴿'))m=1;else if(mode===0&&t.startsWith('['))m=2;
      const f=m===1?FQ:FT,c=m===1?CQ:m===2?CR:CT;ctx.font=f;
      words.push({t,f,c,w:ctx.measureText(t).width,sp:ctx.measureText(' ').width*(m===1?1.2:1)});
      if(t.includes('﴾'))mode=0;else if(m===1)mode=1;else if(m===2&&t.includes(']'))mode=0;else mode=m;
    })});
  const lines=[];let cur=[],lw=0;
  words.forEach(w=>{if(w.br){if(cur.length)lines.push({w:cur});lines.push({gap:1});cur=[];lw=0;return}
    if(cur.length&&lw+w.w>maxW){lines.push({w:cur});cur=[];lw=0}cur.push(w);lw+=w.w+w.sp});
  if(cur.length)lines.push({w:cur});return lines;
}
async function shareImage(a,name,txt){
  const W=1200,P=70,cw=W-2*P;
  const toks=AYTOK[a]||[];const pages=[...new Set(toks.map(t=>t[1]))];
  await Promise.all(pages.map(p=>pageFont(p).catch(()=>{})));
  const banner=await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=BANNER_URL});
  const c=document.createElement('canvas');const ctx=c.getContext('2d');
  const sysF='"SF Arabic",-apple-system,system-ui,Tahoma,sans-serif';
  // measure
  const qfs=56;ctx.font=`${qfs}px p${pages[0]}`;
  const qLines=[];let line=[],lw=0;
  toks.forEach(t=>{ctx.font=`${qfs}px p${t[1]}`;const w=ctx.measureText(t[0]).width+10;if(lw+w>cw&&line.length){qLines.push(line);line=[];lw=0}line.push([t,w]);lw+=w});if(line.length)qLines.push(line);
  const tl=richLines(ctx,quoteMarks(stripJoint(txt)),cw-80,sysF),LH=66;
  const bh=banner?cw*banner.height/banner.width:0;
  const tH=tl.reduce((s,l)=>s+(l.gap?LH*0.4:LH),0);
  const H=P+bh+40+qLines.length*qfs*1.9+60+50+tH+80+P;
  c.width=W;c.height=H;ctx.fillStyle='#fdfbf5';ctx.fillRect(0,0,W,H);
  let y=P;
  if(banner){if(!BANNER_BAKED)ctx.filter='brightness(.86) saturate(1.25)';ctx.drawImage(banner,P,y,cw,bh);ctx.filter='none';
    const s=+a.split(':')[0];const[d,x0,y0,w0,h0]=NAMES[s];const sc=bh*0.62/h0;
    ctx.save();ctx.translate(W/2-w0*sc/2-x0*sc,y+bh*0.19-y0*sc);ctx.scale(sc,sc);ctx.fillStyle='#141414';ctx.fill(new Path2D(d));ctx.restore();y+=bh+40}
  ctx.fillStyle='#000';ctx.textBaseline='middle';ctx.direction='rtl';
  qLines.forEach(l=>{const tw=l.reduce((s,x)=>s+x[1],0);let x=W/2+tw/2;y+=qfs*0.95;
    l.forEach(([t,w])=>{ctx.font=`${qfs}px p${t[1]}`;ctx.textAlign='right';ctx.fillText(t[0],x,y);x-=w});y+=qfs*0.95});
  y+=50;ctx.textAlign='right';ctx.font=`34px ${sysF}`;ctx.fillStyle='#9a8a73';ctx.fillText(name,W-P-20,y);y+=40;
  const ch=tH+60;ctx.fillStyle='#f2eeea';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(P,y,cw,ch,28);else ctx.rect(P,y,cw,ch);ctx.fill();
  let ty=y+30+LH/2;tl.forEach(l=>{if(l.gap){ty+=LH*0.4;return}let x=W-P-40;
    l.w.forEach(w=>{ctx.font=w.f;ctx.fillStyle=w.c;ctx.textAlign='right';ctx.fillText(w.t,x,ty);x-=w.w+w.sp});ty+=LH});
  ctx.textAlign='center';ctx.font=`26px ${sysF}`;ctx.fillStyle='#b9ab95';ctx.fillText('رِواء',W/2,H-P/2-10);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],'tafsir.png',{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  const url=URL.createObjectURL(blob);const lnk=document.createElement('a');lnk.href=url;lnk.download='tafsir.png';document.body.appendChild(lnk);lnk.click();lnk.remove();
}

/* ---------- search ---------- */
const normS=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
/* صفحة البحث: خانة ثابتة في الأعلى كتطبيق آية، والرموز العلوية مخفية أثناء البحث */
function openSearch(){
  closeAll(true);$('srch').classList.add('open');
  const q=$('sq');q.oninput=()=>{clearTimeout(q._t);q._t=setTimeout(doSearch,180);$('sclr').style.visibility=q.value?'visible':'hidden'};
  q.onkeydown=e=>{if(e.key==='Enter')q.blur()};
  $('sclr').onclick=()=>{q.value='';q.oninput();doSearch();q.focus()};
  $('sclr').style.visibility=q.value?'visible':'hidden';
  $('sres').onclick=e=>{if(e.target===$('sres')&&!$('sres').classList.contains('has'))closeSearch()};
  doSearch();setTimeout(()=>q.focus(),200);
}
function closeSearch(){$('sq').blur();$('srch').classList.remove('open')}
/* المسافة في البحث لها معنى: مسافة قبل الحروف = أول الكلمة، ومسافة بعدها = آخر الكلمة */
const NORM_CACHE={};
function doSearch(){
  const R=$('sres');R.innerHTML='';R.classList.remove('has');
  const raw=$('sq').value,q=normS(raw).replace(/\s+/g,' ');const core=q.trim();
  if(/^[0-9٠-٩]+$/.test(core)){const p=+core.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));if(p>=1&&p<=604){R.classList.add('has');
    R.innerHTML=`<div class="scard"><div class="sr"><div class="srt"><span>الذهاب إلى الصفحة</span><span class="pg">${AR(p)}</span></div></div></div>`;R.querySelector('.sr').onclick=()=>{closeSearch();show(p)}}return}
  if(core.length<2)return;
  const hits=[];for(const k in Q.plain){const t=NORM_CACHE[k]||(NORM_CACHE[k]=' '+normS(Q.plain[k]).replace(/\s+/g,' ')+' ');if(t.includes(q)){hits.push(k);if(hits.length>=300)break}}
  R.classList.add('has');
  if(!hits.length){R.innerHTML='<div class="sempty">لا نتائج</div>';return}
  R.innerHTML=`<div class="srh">الآيات (${AR(hits.length)}${hits.length>=300?'+':''})</div><div class="scard"></div>`;
  const card=R.querySelector('.scard');
  hits.forEach(k=>{const d=document.createElement('div');d.className='sr';
    d.innerHTML=`<div class="srt"><span>${esc(ayRef(k))}</span><span class="pg">${AR(Q.ayahPage[k])}</span></div><div class="stx">${esc(Q.text[k])}</div>`;
    d.onclick=()=>{closeSearch();show(Q.ayahPage[k])};d.dataset.k=k;card.appendChild(d);srObs.observe(d)});
}
/* نص الآية في النتائج بخط المصحف نفسه (خط الصفحة) كتطبيق آية، يُحمَّل عند ظهور النتيجة */
const srObs=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const d=en.target;srObs.unobserve(d);
  const toks=(AYTOK[d.dataset.k]||[]).filter(t=>t[2]);if(!toks.length)return;
  const pages=[...new Set(toks.map(t=>t[1]))];
  Promise.all(pages.map(p=>pageFont(p))).then(()=>{const x=d.querySelector('.stx');if(!x)return;
    x.innerHTML=toks.map(([g,p])=>`<span style="font-family:p${p}">${esc(g)}</span>`).join('\u200b');x.classList.add('gl')}).catch(()=>{})}),{root:null,rootMargin:'300px'});

/* ---------- settings ---------- */
/* ألوان الصفحة: [الاسم، لون الورق، لون وسط الإطار ورموز الآيات] */
const PAPERS={def:['الأصلي','#fdfbf5','#e6f0de'],green:['أخضر فاتح','#F4F7E8','#e4ecd0'],blue:['أزرق فاتح','#F3F8FD','#dceaf8'],pink:['وردي فاتح','#FEF5F9','#f7dfe9']};
function applySettings(){
  document.body.classList.toggle('night',!!S.night);document.body.classList.toggle('nodiff',!S.diffs);
  const P=PAPERS[S.paper]||PAPERS.def,rs=document.documentElement.style;
  if(S.night){rs.removeProperty('--paper');rs.setProperty('--mk','#34413a')}else{rs.setProperty('--paper',P[1]);rs.setProperty('--mk',P[2])}
  PRE={};buildBanner();if($('lines')&&$('lines').children.length)requestAnimationFrame(()=>{fillMarkers();if(COMP)fillMarkers(COMP)});
  document.documentElement.style.setProperty('--tsize',S.tsize+'px');
}
function openSettings(){
  aux('الإعدادات',`
    <button class="kbtn" onclick="openDrawer('khatma')"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.8 2.8L16.3 9.5"/></svg>الختمات</button>
    <div class="set"><label>طريقة عرض المعنى والتفسير</label><select id="sMode">
      <option value="bottom" ${S.mode==='bottom'?'selected':''}>نافذة في أسفل الصفحة</option>
      <option value="center" ${S.mode==='center'?'selected':''}>نافذة في وسط الصفحة</option>
      <option value="full" ${S.mode==='full'?'selected':''}>صفحة كاملة</option></select></div>
    <div class="set"><label>التفسير الافتراضي</label><select id="sTaf">${TAFSIRS.map((t,i)=>i===MYI?'':`<option value="${i}" ${i==S.tafsir?'selected':''}>${t[1]}</option>`).join('')}</select></div>
    <div class="set"><label>حجم خط المعاني والتفسير</label><select id="sSize">${[16,17,19,21,24,27].map(v=>`<option ${v==S.tsize?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="set"><label>لون الصفحة</label><select id="sPaper">${Object.entries(PAPERS).map(([k,v])=>`<option value="${k}" ${k===(S.paper||'def')?'selected':''}>${v[0]}</option>`).join('')}</select></div>
    <div class="set"><label>الوضع الليلي</label><input type="checkbox" id="sNight" ${S.night?'checked':''} style="width:auto"></div>
    <div class="set"><label>تلوين مواضع خلاف شعبة</label><input type="checkbox" id="sDiff" ${S.diffs?'checked':''} style="width:auto"></div>
    <div class="legend" style="padding:.6em 0">${Object.entries(DIFF_NAMES).map(([c,n])=>`<span><i style="background:var(--c-${c})"></i>${n}</span>`).join('')}</div>
    <div style="color:var(--muted);font-size:15px;line-height:1.8">• ضغطة سريعة على الكلمة: معناها (وفي ختمة التلاوة: ضغطة مطوّلة).<br>• ضغطة مطوّلة على الكلمة: خلاف شعبة.<br>• ضغطة على رمز الآية: تفسيرها.<br>• ضغطة مطوّلة على رمز الآية: صفحة التفاسير كاملة.</div>`);
  $('sMode').onchange=e=>{S.mode=e.target.value;save('settings',S)};
  $('sTaf').onchange=e=>{S.tafsir=+e.target.value;tvTaf=null;save('settings',S)};
  $('sSize').onchange=e=>{S.tsize=+e.target.value;save('settings',S);applySettings()};
  $('sPaper').onchange=e=>{S.paper=e.target.value;save('settings',S);applySettings()};
  $('sNight').onchange=e=>{S.night=e.target.checked;save('settings',S);applySettings()};
  $('sDiff').onchange=e=>{S.diffs=e.target.checked;save('settings',S);applySettings()};
}

/* ---------- overlays & bars ---------- */
function closeAll(keepBars){
  ['sheet','aux'].forEach(id=>$(id).classList.remove('open'));
  ['pop','full','drw','dim','srch'].forEach(id=>$(id)&&$(id).classList.remove('open'));
  $('tmenu').classList.remove('open');
  if(!keepBars){$('top').classList.remove('open');$('bot').classList.remove('open')}
  selectWord(null);
}
const anyOpen=()=>document.querySelector('.sheet.open,#pop.open,#full.open,#drw.open,#lib.open');
function toggleBars(){
  if(anyOpen()){closeAll();return}
  const o=!$('top').classList.contains('open');$('top').classList.toggle('open',o);$('bot').classList.toggle('open',o);
}
bindPageEl($('page'));
const sl=$('slider');
function slTag(p){const t=$('slTag'),w=sl.clientWidth||$('bot').clientWidth;t.textContent=AR(p);t.style.left=((1-(p-1)/603)*(w-46))+'px'}
addEventListener('resize',()=>slTag(+sl.value));
sl.addEventListener('input',()=>{const p=+sl.value;slTag(p);const b=$('bubble');b.style.display='block';b.textContent=`${AR(p)} — ${sname(surahOfPage(p))}`});
sl.addEventListener('change',()=>{$('bubble').style.display='none';const p=+sl.value;cur=p;show(p).then(()=>{$('top').classList.add('open');$('bot').classList.add('open')})});

/* ---------- navigation ---------- */
/* تقليب الصفحات بالسحب المتصل كتطبيق آية: الصفحة تتبع الإصبع والتي بعدها تدخل بجانبها */
let sx=null,sy=null,st0=0,drag=null,simpleSwipe=false;
/* الصفحتان المجاورتان تُجهَّزان مسبقًا (مرسومة كاملة) فلا يُرسم شيء أثناء السحب، فتبقى الحركة سلسة */
let PRE={},PRERENDER=false;
function bindPageEl(el){if(el._pb)return;el._pb=1;el.addEventListener('click',toggleBars)}
function prerenderOne(n,base){
  const B=$('page'),fresh=B.cloneNode(true);fresh._pb=0;fresh.style.transform='';fresh.style.transition='';fresh.style.visibility='';fresh.style.zIndex='';
  B.replaceWith(fresh);PRERENDER=true;cur=n;
  try{renderPage(n);fillMarkers(fresh)}catch(e){}finally{PRERENDER=false;cur=base;fresh.replaceWith(B)}
  return PRE[n]=fresh;
}
async function prerenderNeighbors(){
  const base=cur;
  for(const n of (isSpread()?[base+2,base+3,base-2,base-1]:[base+1,base-1])){
    if(n<1||n>604||PRE[n])continue;
    try{await pageFont(n)}catch(e){continue}
    if(cur!==base||drag||sx!=null)return;
    prerenderOne(n,base);
  }
}
function schedulePre(){clearTimeout(schedulePre._t);schedulePre._t=setTimeout(prerenderNeighbors,250)}
function setX(el,x,anim){el.style.transition=anim?'transform .26s cubic-bezier(.25,.8,.3,1)':'none';el.style.transform=x?`translate3d(${x}px,0,0)`:''}
function dragReset(){if(!drag)return;const d=drag;drag=null;
  d.cur.forEach(el=>{setX(el,0);el.style.zIndex='';el.style.willChange=''});
  d.nb.forEach(el=>{el.remove();setX(el,0);el.style.zIndex='';el.style.willChange=''})}
let tTarget=null,rafX=0;
function unbindTouch(){if(tTarget){tTarget.removeEventListener('touchmove',onTMove);tTarget.removeEventListener('touchend',onTEnd);tTarget.removeEventListener('touchcancel',onTCancel);tTarget=null}}
addEventListener('touchstart',e=>{
  if(drag&&Date.now()-drag.t>1800)dragReset();
  if(drag||e.touches.length>1||e.target.closest('.sheet,#pop,#full,#drw,#lib,#bot,#top,.menu,#srch,#tview')){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;st0=Date.now();simpleSwipe=false;
  unbindTouch();tTarget=e.target;
  tTarget.addEventListener('touchmove',onTMove,{passive:true});tTarget.addEventListener('touchend',onTEnd,{passive:true});tTarget.addEventListener('touchcancel',onTCancel,{passive:true});
},{passive:true});
function onTMove(e){
  if(sx==null||simpleSwipe)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(!drag){
    if(Math.abs(dx)<10||Math.abs(dx)<Math.abs(dy)*1.3){if(Math.abs(dy)>20)sx=null;return}
    const sp=isSpread(),step=sp?2:1,dir=dx>0?1:-1,to=cur+dir*step;if(to<1||to>604){sx=null;return}
    const want=sp&&to<604?[to,to+1]:[to],nb=[];
    for(const n of want){let el=PRE[n];if(!el&&document.fonts.check(`20px p${n}`))el=prerenderOne(n,cur);if(!el){simpleSwipe=true;return}nb.push(el)}
    const B=$('page'),curEls=COMP?[B,COMP]:[B];
    curEls.forEach(el=>el.style.zIndex=2);nb.forEach(el=>{el.style.zIndex=1;setX(el,0)});B.after(...nb);
    /* المجموعة المجاورة تلتصق بحافة المجموعة الحالية تمامًا */
    const box=els=>{const r=els.map(e=>e.getBoundingClientRect());return{l:Math.min(...r.map(x=>x.left)),r:Math.max(...r.map(x=>x.right))}};
    const rB=box(curEls),rN=box(nb);
    const off=dir>0?rB.l-rN.r:rB.r-rN.l;
    [...curEls,...nb].forEach(el=>el.style.willChange='transform');nb.forEach(el=>setX(el,off));
    drag={from:cur,to,dir,W:Math.abs(off),off,cur:curEls,nb,t:Date.now(),lastX:0};
  }
  const d=drag;d.lastX=d.dir>0?Math.max(0,dx):Math.min(0,dx);d.t=Date.now();
  if(!rafX)rafX=requestAnimationFrame(()=>{rafX=0;if(!drag)return;const d=drag;d.cur.forEach(el=>setX(el,d.lastX));d.nb.forEach(el=>setX(el,d.off+d.lastX))});
}
function onTEnd(e){
  unbindTouch();if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(simpleSwipe){simpleSwipe=false;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)show(cur+(dx>0?1:-1)*(isSpread()?2:1));return}
  if(!drag)return;
  if(rafX){cancelAnimationFrame(rafX);rafX=0}
  const d=drag,v=Math.abs(dx)/Math.max(1,Date.now()-st0);d.t=Date.now();
  const done=Math.sign(d.lastX)===d.dir&&(Math.abs(d.lastX)>d.W*0.2||v>0.4);
  if(done){d.cur.forEach(el=>setX(el,-d.off,true));d.nb.forEach(el=>setX(el,0,true));setTimeout(()=>{if(drag===d)adoptPage(d)},270)}
  else{d.cur.forEach(el=>setX(el,0,true));d.nb.forEach(el=>setX(el,d.off,true));setTimeout(()=>{if(drag===d)dragReset()},270)}
}
/* إتمام التقليب: الصفحة المجهّزة تصير هي الصفحة الحالية دون إعادة رسم */
function adoptPage(d){
  drag=null;const{from,to}=d;
  d.cur.forEach(el=>el.remove());[...d.cur,...d.nb].forEach(el=>{el.style.transition='';el.style.transform='';el.style.zIndex='';el.style.willChange=''});
  PRE={};d.cur.forEach((el,i)=>PRE[from+i]=el);d.nb.forEach(bindPageEl);COMP=d.nb[1]||null;
  cur=to;closeAll(true);if(K.active==='hifz'){K.hifz.page=to;save('khatmas',K)}
  pageChrome(to);
  [to+1,to-1,to+2,to-2,to+3].forEach(n=>{if(n>=1&&n<=604)pageFont(n).catch(()=>{})});
  schedulePre();
}
function onTCancel(){unbindTouch();sx=null;simpleSwipe=false;dragReset()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'){unbindTouch();sx=null;dragReset()}});
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if($('lib').classList.contains('open')){if(e.key==='ArrowLeft')libStep(1);if(e.key==='ArrowRight')libStep(-1);if(e.key==='Escape')closeLib();return}
  const st=isSpread()?2:1;if(e.key==='ArrowLeft')show(cur+st);if(e.key==='ArrowRight')show(cur-st);if(e.key==='Escape')closeAll()});
/* عند تدوير الجهاز أو تغيير المقاس: تُعاد الصفحة (صفحة أو صفحتان حسب الوضع) */
let rsT=0,rsW=innerWidth,rsS=isSpread();
addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{
  if(innerWidth===rsW&&isSpread()===rsS){layout();return}   // تغيّر الطول فقط (كظهور لوحة المفاتيح): لا نعيد الصفحة
  rsW=innerWidth;rsS=isSpread();PRE={};if(drag)dragReset();show(cur)},160)});
/* ---------- إبقاء الشاشة مضاءة ما دام التطبيق مفتوحًا ---------- */
let wakeLock=null;
async function keepAwake(){if(!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
  if(wakeLock&&!wakeLock.released)return;try{wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
addEventListener('touchend',keepAwake,{passive:true});addEventListener('click',keepAwake);
keepAwake();
init();
</script>
